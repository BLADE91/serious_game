<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本生成器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<style>
:root {
  --bg: #f5f0eb;
  --card: #fff;
  --text: #2c2416;
  --text-muted: #6b5e4a;
  --accent: #8b4513;
  --accent-light: #d4a574;
  --danger: #c0392b;
  --success: #27ae60;
  --neutral: #8e7c5e;
  --border: #e0d5c7;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(44,36,22,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

header { text-align: center; padding: 32px 0 16px; }
header h1 { font-size: 28px; color: var(--accent); letter-spacing: 2px; }
header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
.card h2 { font-size: 16px; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 500; }
input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); transition: border-color .2s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; }
.btn-primary:hover { background: #6b3410; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-sm { padding: 6px 14px; font-size: 13px; }

.progress-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.progress-text { font-size: 13px; color: var(--text-muted); }

.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; background: var(--bg); color: var(--text-muted); border: 1px solid transparent; transition: all .2s; }
.tab.active { background: var(--card); color: var(--accent); border-color: var(--border); border-bottom-color: var(--card); margin-bottom: -2px; font-weight: 600; }

.panel { display: none; }
.panel.active { display: block; }

.act-card { border-left: 3px solid var(--accent-light); padding: 12px 16px; margin-bottom: 12px; background: var(--bg); border-radius: 0 var(--radius) var(--radius) 0; overflow: hidden; }
.act-card h3 { font-size: 15px; color: var(--accent); margin-bottom: 4px; }
.act-card .act-meta { font-size: 12px; color: var(--text-muted); }

.npc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.npc-chip { padding: 8px 12px; background: var(--bg); border-radius: var(--radius); font-size: 13px; border: 1px solid var(--border); }
.npc-chip .name { font-weight: 600; color: var(--accent); }
.npc-chip .type { font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
.type-cadre { background: #e74c3c22; color: #c0392b; }
.type-external { background: #f39c1222; color: #d68910; }
.type-villager { background: #27ae6022; color: #1e8449; }

.rel-group { margin-bottom: 12px; }
.rel-group h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.rel-item { font-size: 13px; padding: 4px 0; border-bottom: 1px dotted var(--border); display: flex; gap: 8px; align-items: baseline; }
.rel-item .arrow { color: var(--text-muted); }
.rel-item .desc { color: var(--text-muted); font-size: 12px; }

.decision-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; overflow: hidden; }
.decision-card.critical { border-left: 3px solid var(--danger); }
.decision-card h3 { font-size: 15px; }
.decision-card .dp-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.decision-card .situation { font-size: 14px; margin-bottom: 12px; padding: 10px; background: var(--bg); border-radius: var(--radius); }

.option-card { padding: 10px 14px; margin: 6px 0; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; overflow: hidden; }
.option-card .opt-cost { font-size: 11px; color: var(--text-muted); float: right; }
.option-card .opt-risk { color: var(--danger); font-size: 12px; margin-top: 4px; }

.ending-card { border-left: 4px solid var(--neutral); padding: 12px 16px; margin-bottom: 12px; background: var(--bg); border-radius: 0 var(--radius) var(--radius) 0; overflow: hidden; }
.ending-card.good { border-color: var(--success); }
.ending-card.bad { border-color: var(--danger); }
.ending-card h3 { font-size: 15px; }
.ending-card .conditions { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.feedback-area { display: flex; gap: 8px; margin-top: 12px; }
.feedback-area input { flex: 1; }

.hidden { display: none; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-good { background: #27ae6022; color: #1e8449; }
.badge-neutral { background: #f39c1222; color: #d68910; }
.badge-bad { background: #e74c3c22; color: #c0392b; }

.inline-edit-btn { float: right; padding: 2px 8px; font-size: 11px; background: transparent; color: var(--text-muted); border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; font-family: inherit; transition: all .2s; }
.inline-edit-btn:hover { color: var(--accent); border-color: var(--accent-light); background: #fff; }
.inline-edit-btn-sm { float: right; padding: 0px 6px; font-size: 10px; background: transparent; color: var(--text-muted); border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; font-family: inherit; transition: all .2s; }
.inline-edit-btn-sm:hover { color: var(--accent); border-color: var(--accent-light); background: #fff; }

.inline-edit-panel { margin: 8px 0 12px; padding: 16px; background: #fdfaf5; border: 1px solid var(--accent-light); border-radius: var(--radius); }
.inline-edit-panel h4 { font-size: 13px; color: var(--accent); margin-bottom: 12px; }
.edit-field-row { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.edit-field-row label { font-size: 12px; color: var(--text-muted); min-width: 60px; margin-bottom: 0; }
.edit-field-row input, .edit-field-row textarea, .edit-field-row select { flex: 1; padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; color: var(--text); font-family: inherit; }
.edit-field-row textarea { min-height: 48px; resize: vertical; }
.edit-field-row input[type=number] { max-width: 100px; flex: 0 0 auto; }
.edit-field-row input:focus, .edit-field-row textarea:focus, .edit-field-row select:focus { outline: none; border-color: var(--accent); }
.edit-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.edit-actions .btn { font-size: 12px; padding: 6px 14px; }
.ai-feedback-row { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.ai-feedback-row input { flex: 1; font-size: 12px; padding: 6px 8px; }


/* 分叉树 */
.tree-container { position: relative; width: 100%; height: 550px; border: 1px solid var(--border); border-radius: var(--radius); background: #fdfaf7; overflow: hidden; cursor: grab; user-select: none; }
.tree-container:active { cursor: grabbing; }
.tree-container svg { display: block; }
.tree-node { cursor: pointer; transition: stroke .2s; }
.tree-node:hover { stroke-width: 3px; }
.tree-node.critical { stroke: var(--danger); stroke-width: 2.5px; }
.tree-link { stroke: var(--accent-light); fill: none; stroke-width: 1.5px; }
.tree-link.option { stroke: var(--text-muted); stroke-dasharray: 6 3; stroke-width: 1px; }
.tree-ending.good .tree-node-bg { fill: #27ae6022; stroke: var(--success); }
.tree-ending.bad .tree-node-bg { fill: #e74c3c22; stroke: var(--danger); }
.tree-ending.neutral .tree-node-bg { fill: #f39c1222; stroke: #d68910; }
.tree-label { font-size: 12px; fill: var(--text); pointer-events: none; }
.tree-label-sm { font-size: 10px; fill: var(--text-muted); pointer-events: none; }
.tree-tooltip { position: absolute; padding: 8px 12px; background: var(--card); border: 1px solid var(--accent-light); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 12px; max-width: 300px; pointer-events: none; z-index: 100; display: none; }
.tree-legend { display: flex; gap: 16px; padding: 8px 0; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
.tree-legend span { display: flex; align-items: center; gap: 4px; }
.tree-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }

</style>
</head>
<body>
<div class="container">

<header>
  <h1>🏛️ 剧本生成器</h1>
  <p>严肃游戏结构化剧本生成与修订工具</p>
</header>

<!-- 输入区 -->
<div class="card" id="input-card">
  <h2>📝 剧本参数</h2>
  <div class="form-grid">
    <div>
      <label for="scenario">政策场景 *</label>
      <input id="scenario" placeholder="如：生态搬迁、征地拆迁" value="生态搬迁">
    </div>
    <div>
      <label for="playerRole">玩家角色 *</label>
      <input id="playerRole" placeholder="如：乡镇党委副书记" value="乡镇党委副书记">
    </div>
    <div class="full">
      <label for="learningGoal">教育目标 *</label>
      <input id="learningGoal" placeholder="如：体验基层政策执行中多重压力的权衡与抉择" value="体验基层政策执行中多重压力的权衡与抉择">
    </div>
    <div>
      <label for="duration">目标时长</label>
      <select id="duration">
        <option value="30">30 分钟</option>
        <option value="45" selected>45 分钟</option>
        <option value="60">60 分钟</option>
        <option value="90">90 分钟</option>
      </select>
    </div>
    <div>
      <label for="complexity">复杂度</label>
      <select id="complexity">
        <option value="simple">简单</option>
        <option value="medium" selected>中等</option>
        <option value="complex">复杂</option>
      </select>
    </div>
    <div>
      <label for="npcCount">NPC 数量</label>
      <select id="npcCount">
        <option value="8">8 人</option>
        <option value="10">10 人</option>
        <option value="12" selected>12 人</option>
        <option value="15">15 人</option>
      </select>
    </div>
    <div>
      <label for="chapterCount">章节数量</label>
      <select id="chapterCount">
        <option value="4">4 章</option>
        <option value="5">5 章</option>
        <option value="6" selected>6 章</option>
        <option value="7">7 章</option>
        <option value="8">8 章</option>
      </select>
    </div>
    <div>
      <label for="endingCount">结局数量</label>
      <select id="endingCount">
        <option value="3">3 个</option>
        <option value="4" selected>4 个</option>
        <option value="5">5 个</option>
        <option value="6">6 个</option>
      </select>
    </div>
    <div class="full">
      <label for="characterSettings">人物设定（可选）</label>
      <input id="characterSettings" placeholder="如：县委书记是改革派，村支书是保守派，两个家族有世仇…">
    </div>
    <div class="full">
      <label for="storyBackground">故事背景（可选）</label>
      <textarea id="storyBackground" placeholder="如：2024年，某县因水源地保护需要搬迁3个村共36户居民，县财政紧张，上级要求年底前完成…"></textarea>
    </div>
    <div class="full">
      <label for="extra">额外要求（可选）</label>
      <textarea id="extra" placeholder="如：需要涉及宗族矛盾、加入媒体监督角色"></textarea>
    </div>
  </div>
  <div style="display:flex; gap:12px;">
    <button class="btn btn-primary" id="generateMdBtn" onclick="startMdGeneration()" style="flex:1;">
      📝 生成剧本 MD
    </button>
    <button class="btn btn-secondary" id="oneClickBtn" onclick="startOneClickGeneration()">
      ⚡ 一键生成
    </button>
    <button class="btn btn-secondary" id="loadBtn" onclick="loadLatestResult()">
      📂 加载
    </button>
  </div>
</div>

<!-- 进度区 -->
<div class="card hidden" id="progress-card">
  <h2>⏳ 生成进度</h2>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <p class="progress-text" id="progressText">准备中...</p>
  <button class="btn btn-secondary btn-sm" id="cancelBtn" onclick="cancelGeneration()" style="margin-top:12px;">⏹ 取消生成</button>
</div>

<!-- 结果区 -->
<div class="card hidden" id="result-card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div>
      <h2 style="margin:0; padding:0; border:none; display:inline;">📋 生成结果</h2>
      <span id="currentVersionLabel" style="display:none; margin-left:8px; font-size:12px; color:var(--accent); background:var(--bg); padding:3px 10px; border-radius:4px; font-weight:600;"></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn btn-secondary btn-sm" onclick="downloadResult()">📥 下载 JSON</button>
      <button class="btn btn-secondary btn-sm" id="versionsBtn" onclick="toggleVersions()">📜 版本历史</button>
    </div>
  </div>
  <div class="card hidden" id="versions-card" style="margin-bottom:16px; padding:16px;">
    <h3 style="font-size:14px; margin-bottom:8px;">📜 版本历史</h3>
    <div id="versionsList" style="max-height:200px; overflow-y:auto; font-size:13px;"></div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-panel="overview">📊 概览</div>
    <div class="tab" data-panel="npcs">👥 NPC 网络</div>
    <div class="tab" data-panel="tree">🌳 剧情分叉树</div>
    <div class="tab" data-panel="mdtext">📝 剧本原文</div>
  </div>
  <div id="panel-overview" class="panel active"></div>
  <div id="panel-npcs" class="panel"></div>
  <div id="panel-tree" class="panel"></div>
  <div id="panel-mdtext" class="panel"></div>

  <!-- 反馈修订 -->
  <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border);">
    <label for="feedback">💬 反馈修订</label>
    <div class="feedback-area">
      <input id="feedback" placeholder="如：NPC关系网太简单，希望增加更多矛盾冲突">
      <button class="btn btn-secondary btn-sm" id="reviseBtn" onclick="startRevision()">✏️ 修订</button>
    </div>
  </div>
</div>

<!-- 错误区 -->
<div class="card hidden" id="error-card" style="border-left:4px solid var(--danger);">
  <h2>❌ 出错了</h2>
  <p id="errorText" style="color:var(--danger);"></p>
</div>

</div>

<script>
// ===== 全局状态 =====
let lastResult = null;
let activeAbortController = null;
let activeTaskId = null;

// ===== Tab 切换 =====
document.getElementById('tabs')?.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('panel-' + tab.dataset.panel)?.classList.add('active');
});

// ===== SSE 流读取 =====
async function* readSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let eventType = '';
  let dataBuffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';

    for (const line of lines) {
      if (line.startsWith('event:')) {
        eventType = line.slice(6).trim();
      } else if (line.startsWith('data:')) {
        dataBuffer = line.slice(5).trim();
      } else if (line === '' && eventType && dataBuffer) {
        try {
          yield { event: eventType, data: JSON.parse(dataBuffer) };
        } catch {
          yield { event: eventType, data: dataBuffer };
        }
        eventType = '';
        dataBuffer = '';
      }
    }
  }
}

// ===== UI 控制 =====
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function setProgress(stage, total, name) {
  show('progress-card');
  const pct = Math.round((stage / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `阶段 ${stage}/${total}：${name}`;
}
function showError(msg) {
  show('error-card');
  document.getElementById('errorText').textContent = msg;
  hide('progress-card');
}

function setButtonLoading(btn, loading) {
  if (loading) {
    btn.disabled = true;
    btn.dataset.origText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span> 生成中...';
  } else {
    btn.disabled = false;
    btn.textContent = btn.dataset.origText || '⚡ 一键生成';
  }
}

// ===== 取消生成 =====
async function cancelGeneration() {
  if (activeAbortController) {
    activeAbortController.abort();
    activeAbortController = null;
  }
  if (activeTaskId) {
    try {
      await fetch(`/api/cancel/${activeTaskId}`, { method: 'POST' });
    } catch {}
    activeTaskId = null;
  }
  hide('progress-card');
  document.getElementById('generateMdBtn').disabled = false;
  document.getElementById('generateMdBtn').textContent = '📝 生成剧本 MD';
}

// ===== 加载已有结果 =====
async function loadLatestResult() {
  hide('error-card');
  hide('result-card');
  const btn = document.getElementById('loadBtn');
  btn.disabled = true;
  btn.textContent = '加载中...';

  try {
    const resp = await fetch('/api/latest-result');
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '加载失败 ' + resp.status);
    }
    const data = await resp.json();
    lastResult = data;
    if (data.full_md) {
      lastFullMD = normalizeFullMD(data.full_md);
                }
    renderResult(data);
    show('result-card');
    updateVersionLabel(data.filename || data.saved_as || '');
    document.getElementById('feedback').value = '';
    // 滚动到结果区
    document.getElementById('result-card').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📂 加载最近结果';
  }
}

// ===== 行内手动编辑 =====
let activeEditPanel = null;

function getElementFields(elementType, elementId) {
  // 从 lastResult.script 中查找元素，返回可编辑字段列表
  const s = lastResult?.script;
  if (!s) return [];

  switch (elementType) {
    case 'NPC': {
      const npc = (s.npc_seed||[]).find(n => n.npc_id === elementId);
      if (!npc) return [];
      return [
        {key:'name', label:'姓名', value:npc.name},
        {key:'npc_type', label:'类型', value:npc.npc_type, type:'select', options:['cadre','external','villager']},
        {key:'group', label:'所属群体', value:npc.group},
        {key:'trust_to_player', label:'信任度', value:npc.trust_to_player, type:'number'},
        {key:'attitude_score', label:'态度值', value:npc.attitude_score, type:'number'},
        {key:'anxiety_level', label:'焦虑值', value:npc.anxiety_level, type:'number'},
      ];
    }
    case '关系': {
      const parts = elementId.split('|');
      const idx = parseInt(parts[2]);
      const rel = (s.npc_relationships||[])[idx];
      if (!rel) return [];
      return [
        {key:'relation_type', label:'关系类型', value:rel.relation_type, type:'select', options:['亲属','上下级','利益同盟','矛盾对立','信息渠道','情感纽带']},
        {key:'strength', label:'强度', value:rel.strength, type:'number'},
        {key:'description', label:'描述', value:rel.description, type:'textarea'},
      ];
    }
    case '选项': {
      const [dpId, optId] = elementId.split('|');
      const dp = (s.decision_points||[]).find(d => d.decision_id === dpId);
      if (!dp) return [];
      const opt = (dp.options||[]).find(o => o.option_id === optId);
      if (!opt) return [];
      return [
        {key:'label', label:'标签', value:opt.label},
        {key:'description', label:'描述', value:opt.description, type:'textarea'},
        {key:'cost_action_points', label:'AP消耗', value:opt.cost_action_points, type:'number'},
        {key:'budget_cost', label:'预算消耗', value:opt.budget_cost, type:'number'},
        {key:'risks', label:'风险（一行一个）', value:(opt.risks||[]).join('\n'), type:'textarea'},
      ];
    }
    case '决策点': {
      const dp = (s.decision_points||[]).find(d => d.decision_id === elementId);
      if (!dp) return [];
      return [
        {key:'title', label:'标题', value:dp.title},
        {key:'day_window', label:'时间窗口', value:dp.day_window},
        {key:'situation', label:'情境描述', value:dp.situation, type:'textarea'},
        {key:'is_critical', label:'关键决策', value:dp.is_critical?'true':'false', type:'select', options:['false','true']},
      ];
    }
    case '结局': {
      const ending = (s.endings||[]).find(e => e.ending_id === elementId);
      if (!ending) return [];
      return [
        {key:'title', label:'标题', value:ending.title},
        {key:'ending_type', label:'类型', value:ending.ending_type, type:'select', options:['good','neutral','bad']},
        {key:'description', label:'描述', value:ending.description, type:'textarea'},
        {key:'conditions', label:'条件（一行一个）', value:(ending.conditions||[]).join('\n'), type:'textarea'},
      ];
    }
    case '第1幕': case '第2幕': case '第3幕': {
      const actNum = elementType === '第1幕' ? 1 : elementType === '第2幕' ? 2 : 3;
      const act = (s.acts||[]).find(a => a.act_number === actNum);
      if (!act) return [];
      return [
        {key:'title', label:'标题', value:act.title},
        {key:'day_range', label:'时间窗口', value:act.day_range},
        {key:'goal', label:'目标', value:act.goal, type:'textarea'},
        {key:'description', label:'描述', value:act.description, type:'textarea'},
      ];
    }
  }
  return [];
}

function openManualEdit(targetEl, elementType, elementId, elementTitle) {
  closeManualEdit();

  const fields = getElementFields(elementType, elementId);
  if (!fields.length) { showError('找不到可编辑的字段'); return; }

  const panel = document.createElement('div');
  panel.className = 'inline-edit-panel';
  panel.id = 'inlineEditPanel';
  panel.dataset.elementType = elementType;
  panel.dataset.elementId = elementId;
  panel.dataset.elementTitle = elementTitle;

  let fieldsHtml = `<h4>✏️ 编辑：${elementType} ${elementId ? esc(elementId.split('|')[0] || elementId) : ''}「${esc(elementTitle)}」</h4>`;
  for (const f of fields) {
    if (f.type === 'textarea') {
      fieldsHtml += `<div class="edit-field-row"><label>${esc(f.label)}</label><textarea data-key="${esc(f.key)}">${esc(String(f.value))}</textarea></div>`;
    } else if (f.type === 'number') {
      fieldsHtml += `<div class="edit-field-row"><label>${esc(f.label)}</label><input type="number" data-key="${esc(f.key)}" value="${esc(String(f.value))}"></div>`;
    } else if (f.type === 'select') {
      fieldsHtml += `<div class="edit-field-row"><label>${esc(f.label)}</label><select data-key="${esc(f.key)}">${(f.options||[]).map(o => `<option value="${esc(o)}" ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    } else {
      fieldsHtml += `<div class="edit-field-row"><label>${esc(f.label)}</label><input type="text" data-key="${esc(f.key)}" value="${esc(String(f.value))}"></div>`;
    }
  }

  panel.innerHTML = fieldsHtml + `
    <div class="edit-actions">
      <button class="btn btn-primary" onclick="saveLocalEdit(this)" style="flex:1;">💾 本地保存</button>
      <button class="btn btn-secondary" onclick="closeManualEdit()">↩ 取消</button>

    <div class="ai-feedback-row">
      <input id="aiFeedbackInput" placeholder="或用 AI 修订：输入修改意见...">
      <button class="btn btn-secondary" onclick="submitAIRevision(this)">🤖 AI 修订</button>
    </div>
  `;

  targetEl.parentNode.insertBefore(panel, targetEl.nextSibling);
  activeEditPanel = panel;
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeManualEdit() {
  if (activeEditPanel) {
    activeEditPanel.remove();
    activeEditPanel = null;

}

function saveLocalEdit(btn) {
  const panel = btn.closest('.inline-edit-panel');
  if (!panel) return;

  const elementType = panel.dataset.elementType;
  const elementId = panel.dataset.elementId;
  const s = lastResult.script;

  // 收集所有字段值
  const values = {};
  panel.querySelectorAll('[data-key]').forEach(el => {
    values[el.dataset.key] = el.value;
  });

  // 根据类型定位并修改
  try {
    switch (elementType) {
      case 'NPC': {
        const npc = (s.npc_seed||[]).find(n => n.npc_id === elementId);
        if (!npc) throw new Error('NPC not found');
        if (values.name) npc.name = values.name;
        if (values.npc_type) npc.npc_type = values.npc_type;
        if (values.group) npc.group = values.group;
        if (values.trust_to_player) npc.trust_to_player = parseInt(values.trust_to_player) || 0;
        if (values.attitude_score) npc.attitude_score = parseInt(values.attitude_score) || 0;
        if (values.anxiety_level) npc.anxiety_level = parseInt(values.anxiety_level) || 0;
        break;
      }
      case '关系': {
        // elementId 格式: "from_npc_id|to_npc_id|index"
        const parts = elementId.split('|');
        const idx = parseInt(parts[2]);
        const rel = (s.npc_relationships||[])[idx];
        if (!rel) throw new Error('关系 not found');
        if (values.relation_type) rel.relation_type = values.relation_type;
        if (values.strength) rel.strength = parseInt(values.strength) || 50;
        if (values.description !== undefined) rel.description = values.description;
        break;
      }
      case '选项': {
        // elementId 格式: "decision_id|option_id"
        const [dpId, optId] = elementId.split('|');
        const dp = (s.decision_points||[]).find(d => d.decision_id === dpId);
        if (!dp) throw new Error('决策点 not found');
        const opt = (dp.options||[]).find(o => o.option_id === optId);
        if (!opt) throw new Error('选项 not found');
        if (values.label) opt.label = values.label;
        if (values.description !== undefined) opt.description = values.description;
        if (values.cost_action_points) opt.cost_action_points = parseInt(values.cost_action_points) || 0;
        if (values.budget_cost) opt.budget_cost = parseInt(values.budget_cost) || 0;
        if (values.risks !== undefined) opt.risks = values.risks.split('\n').map(s=>s.trim()).filter(Boolean);
        break;
      }
      case '决策点': {
        const dp = (s.decision_points||[]).find(d => d.decision_id === elementId);
        if (!dp) throw new Error('决策点 not found');
        if (values.title) dp.title = values.title;
        if (values.day_window) dp.day_window = values.day_window;
        if (values.situation !== undefined) dp.situation = values.situation;
        if (values.is_critical !== undefined) dp.is_critical = values.is_critical === 'true';
        break;
      }
      case '结局': {
        const ending = (s.endings||[]).find(e => e.ending_id === elementId);
        if (!ending) throw new Error('结局 not found');
        if (values.title) ending.title = values.title;
        if (values.description !== undefined) ending.description = values.description;
        if (values.ending_type) ending.ending_type = values.ending_type;
        if (values.conditions !== undefined) ending.conditions = values.conditions.split('\n').map(s=>s.trim()).filter(Boolean);
        break;
      }
      case '第1幕': case '第2幕': case '第3幕': {
        const actNum = elementType === '第1幕' ? 1 : elementType === '第2幕' ? 2 : 3;
        const act = (s.acts||[]).find(a => a.act_number === actNum);
        if (!act) throw new Error('幕 not found');
        if (values.title) act.title = values.title;
        if (values.day_range) act.day_range = values.day_range;
        if (values.goal !== undefined) act.goal = values.goal;
        if (values.description !== undefined) act.description = values.description;
        break;
      }
    }
  } catch (err) {
    showError('本地保存失败：' + err.message);
    return;
  }

  closeManualEdit();
  renderResult(lastResult);
  show('result-card');
  // 异步保存到服务端
  fetch('/api/save-manual', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ result: lastResult, source: 'manual' }),
  }).then(r => r.json()).then(data => {
    if (data.saved_as) updateVersionLabel(data.saved_as);
  }).catch(() => {});
}


function downloadResult() {
  if (!lastResult) return;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  a.download = `script_modified_${ts}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function updateVersionLabel(filename) {
  const el = document.getElementById('currentVersionLabel');
  if (!el) return;
  if (!filename) { el.style.display = 'none'; return; }
  const sourceLabel = { script_generate:'初始生成', script_revise:'全局修订', script_ai_element:'局部AI', script_manual:'手动修改' };
  // 格式: v06/script_generate_20260619_151126.json
  const match = filename.match(/^(v\d{2})\/(script_[a-z_]+?)_\d/);
  if (match) {
    el.style.display = 'inline';
    el.innerHTML = `<span style="font-weight:700;">${esc(match[1].toUpperCase())}</span> <span style="color:var(--text-muted);">${esc(sourceLabel[match[2]] || match[2])}</span>`;
    return;
  }
  el.style.display = 'none';
}

async function submitAIRevision(btn) {
  const panel = btn.closest('.inline-edit-panel');
  if (!panel) return;
  const input = panel.querySelector('#aiFeedbackInput');
  const feedback = (input?.value || '').trim();
  if (!feedback) { showError('请输入修改意见'); return; }

  const elementType = panel.dataset.elementType;
  const elementId = panel.dataset.elementId;
  const elementTitle = panel.dataset.elementTitle;

  // 获取当前元素数据
  const fields = getElementFields(elementType, elementId);
  if (!fields.length) { showError('找不到元素数据'); return; }
  const currentElement = {};
  fields.forEach(f => { currentElement[f.key] = f.value; });

  // 构建最小上下文
  const s = lastResult.script;
  const context = {
    script_title: s.title || '',
    script_premise: s.premise || '',
    npc_summary: (s.npc_seed||[]).map(n => ({npc_id:n.npc_id, name:n.name, npc_type:n.npc_type, group:n.group})),
  };

  closeManualEdit();
  show('progress-card');
  document.getElementById('progressBar').style.width = '30%';
  document.getElementById('progressText').textContent = `正在修订：${elementType}「${elementTitle}」...`;

  try {
    const resp = await fetch('/api/revise-element', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ element_type: elementType, element_id: elementId, current_element: currentElement, feedback, context }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '局部修订失败 ' + resp.status);
    }

    const { element: revised } = await resp.json();
    if (!revised) throw new Error('返回的元素为空');

    // 局部 merge 到 lastResult
    mergeRevisedElement(elementType, elementId, revised);

    hide('progress-card');
    closeManualEdit();
    renderResult(lastResult);
    show('result-card');
    // 异步保存合并后的完整结果到服务端（版本管理）
    fetch('/api/save-manual', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ result: lastResult, source: 'ai_element' }),
    }).then(r => r.json()).then(data => {
      if (data.saved_as) updateVersionLabel(data.saved_as);
    }).catch(() => {});
  } catch (err) {
    hide('progress-card');
    showError(err.message);
  }
}

function mergeRevisedElement(elementType, elementId, revised) {
  const s = lastResult.script;
  switch (elementType) {
    case 'NPC': {
      const idx = (s.npc_seed||[]).findIndex(n => n.npc_id === elementId);
      if (idx >= 0) s.npc_seed[idx] = { ...s.npc_seed[idx], ...revised };
      break;
    }
    case '关系': {
      const parts = elementId.split('|');
      const idx = parseInt(parts[2]);
      if (idx >= 0 && idx < (s.npc_relationships||[]).length) {
        s.npc_relationships[idx] = { ...s.npc_relationships[idx], ...revised };
      }
      break;
    }
    case '选项': {
      const [dpId, optId] = elementId.split('|');
      const dp = (s.decision_points||[]).find(d => d.decision_id === dpId);
      if (dp) {
        const oi = (dp.options||[]).findIndex(o => o.option_id === optId);
        if (oi >= 0) dp.options[oi] = { ...dp.options[oi], ...revised };
      }
      break;
    }
    case '决策点': {
      const idx = (s.decision_points||[]).findIndex(d => d.decision_id === elementId);
      if (idx >= 0) s.decision_points[idx] = { ...s.decision_points[idx], ...revised };
      break;
    }
    case '结局': {
      const idx = (s.endings||[]).findIndex(e => e.ending_id === elementId);
      if (idx >= 0) s.endings[idx] = { ...s.endings[idx], ...revised };
      break;
    }
    case '第1幕': case '第2幕': case '第3幕': {
      const actNum = elementType === '第1幕' ? 1 : elementType === '第2幕' ? 2 : 3;
      const idx = (s.acts||[]).findIndex(a => a.act_number === actNum);
      if (idx >= 0) s.acts[idx] = { ...s.acts[idx], ...revised };
      break;
    }
  }
}

async function startRevisionWithTarget(feedback) {
  if (!feedback) return;
  if (!lastResult) { showError('没有可修订的结果'); return; }

  hide('error-card');
  show('progress-card');
  document.getElementById('progressBar').style.width = '50%';
  document.getElementById('progressText').textContent = '正在根据反馈修订剧本...';

  activeAbortController = new AbortController();

  try {
    const resp = await fetch('/api/revise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ previous_result: lastResult, feedback: feedback }),
      signal: activeAbortController.signal,
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '修订失败 ' + resp.status);
    }

    for await (const { event, data } of readSSE(resp)) {
      if (event === 'result') {
        lastResult = data;
        renderResult(data);
        hide('progress-card');
        show('result-card');
        updateVersionLabel(data.saved_as || '');
        document.getElementById('feedback').value = '';
      } else if (event === 'error') {
        showError(data.message);
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      showError(err.message);
    }
  } finally {
    activeAbortController = null;
  }
}

async function startGeneration() {

  }

  hide('error-card');

  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scenario,
        player_role: playerRole,
        learning_goal: learningGoal,
        duration_minutes: parseInt(document.getElementById('duration').value),

      signal: activeAbortController.signal,
    });

    // 从响应头拿 task_id
    activeTaskId = resp.headers.get('X-Task-Id');

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '请求失败 ' + resp.status);
    }

    for await (const { event, data } of readSSE(resp)) {
      if (event === 'progress') {
        setProgress(data.stage, data.total, data.name);
      } else if (event === 'result') {
        lastResult = data;
        if (data.full_md) {
          lastFullMD = normalizeFullMD(data.full_md);

        renderResult(data);
        hide('progress-card');
        show('result-card');
        updateVersionLabel(data.saved_as || '');
        document.getElementById('feedback').value = '';
      } else if (event === 'error') {
        showError(data.message);
      } else if (event === 'cancelled') {
        hide('progress-card');
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      // 用户主动取消，不显示错误
    } else {
      showError(err.message);
    }
  } finally {
    setButtonLoading(btn, false);
    activeAbortController = null;
    activeTaskId = null;
  }
}

// ===== 数据规范化 =====
function normalizeFullMD(raw) {
  if (!raw) return '';
  // 如果 full_md 是不小心存进去的 JSON，提取内层 full_md
  if (raw.trim().startsWith('{')) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed.full_md && typeof parsed.full_md === 'string') {
        return parsed.full_md;
      }
    } catch {}
  }
  return raw;
}

// ===== 分叉树渲染 =====
let treeState = { offsetX: 0, offsetY: 0, scale: 1, dragging: false, startX: 0, startY: 0, collapsed: {} };
let lastFullMD = '';

function buildTreeData(script) {
  const decisions = (script.decision_points || []).slice().sort((a, b) => {
    const da = parseInt((a.day_window || '1').replace(/[^0-9]/g, '')) || 1;
    const db = parseInt((b.day_window || '1').replace(/[^0-9]/g, '')) || 1;
    return da - db;
  });
  const endings = script.endings || [];
  // Group by act, then split into visual rows (max 4 per row)
  const actGroups = [[], [], []];
  decisions.forEach(d => {
    const day = parseInt((d.day_window || '1').replace(/[^0-9]/g, '')) || 1;
    if (day <= 20) actGroups[0].push(d);
    else if (day <= 55) actGroups[1].push(d);
    else actGroups[2].push(d);
  });
  // Flatten acts into visual rows
  const MAX_PER_ROW = 4;
  const visualRows = [];  // [{nodes, actLabel}]
  for (let a = 0; a < 3; a++) {
    const nodes = actGroups[a];
    if (!nodes.length) continue;
    const actNames = ['第一幕：开局破冰', '第二幕：矛盾激化', '第三幕：收束结局'];
    for (let i = 0; i < nodes.length; i += MAX_PER_ROW) {
      visualRows.push({
        nodes: nodes.slice(i, i + MAX_PER_ROW),
        actLabel: i === 0 ? actNames[a] : '',
      });
    }
  }
  return { decisions, endings, visualRows };
}

function renderTree(script) {
	  const panel = document.getElementById('panel-tree');
	  if (!panel) return;
	  if (!script || !script.decision_points || !script.decision_points.length) {
	    panel.innerHTML = '<p style="color:var(--text-muted); padding:40px; text-align:center;">暂无决策点数据，无法生成分叉树</p>';
	    return;
	  }
	  const { decisions, endings, visualRows } = buildTreeData(script);
	  const MAX_PER_COL = 4;
	  const NODE_W = 170, NODE_H = 50, COL_W = 200, SLOT_H = 90, PAD_X = 60, PAD_Y = 30;

	  // Build columns: each visualRows entry becomes a column (left→right)
	  const columns = visualRows;  // [{nodes, actLabel}]
	  const numCols = columns.length;
	  const endingsCol = numCols;  // endings column index

	  const totalW = PAD_X + COL_W * (numCols + 1) + PAD_X;
	  const totalH = PAD_Y + MAX_PER_COL * SLOT_H + PAD_Y;

	  treeState = { offsetX: 0, offsetY: 0, scale: 1, dragging: false, startX: 0, startY: 0, collapsed: {} };

	  let svg = '<svg viewBox="0 0 ' + totalW + ' ' + totalH + '" style="width:100%; height:100%;">';

	  // Act background bands (vertical)
	  const actColors = ['#e8f0fe22', '#fef7e022', '#fce8e622'];
	  let lastActLabel = '';
	  for (let c = 0; c < numCols; c++) {
	    const col = columns[c];
	    if (col.actLabel && col.actLabel !== lastActLabel) {
	      const x = PAD_X + COL_W * c;
	      const w = COL_W;  // minimum width, will be extended
	      svg += '<rect x="' + x + '" y="' + PAD_Y + '" width="' + w + '" height="' + (totalH - PAD_Y * 2) + '" rx="8" fill="' + actColors[c % 3] + '" stroke="var(--border)" stroke-dasharray="6 3" opacity="0.5"/>';
	      svg += '<text x="' + (x + 8) + '" y="' + (PAD_Y + 14) + '" class="tree-label-sm" font-weight="600" fill="var(--text-muted)">' + col.actLabel + '</text>';
	      lastActLabel = col.actLabel;
	    }
	  }

	  // Helper: get node Y position within a column
	  function nodeY(nodes, i) {
	    const totalH_inner = nodes.length * SLOT_H;
	    const startY = PAD_Y + (MAX_PER_COL * SLOT_H - totalH_inner) / 2;
	    return startY + SLOT_H * i + SLOT_H / 2;
	  }

	  // Helper: get column center X
	  function colX(colIndex) {
	    return PAD_X + COL_W * colIndex + COL_W / 2;
	  }

	  // Root node (far left)
	  const rootCX = PAD_X - 10, rootCY = totalH / 2;
	  svg += '<rect x="' + (rootCX - 20) + '" y="' + (rootCY - 18) + '" width="70" height="36" rx="18" fill="var(--accent)" opacity="0.9"/>';
	  svg += '<text x="' + rootCX + '" y="' + (rootCY + 5) + '" text-anchor="middle" class="tree-label" fill="#fff" font-weight="600" font-size="11">开始</text>';

	  // Links root → first column
	  if (numCols > 0) {
	    const firstCol = columns[0].nodes;
	    firstCol.forEach((d, i) => {
	      const tx = colX(0) - NODE_W / 2;
	      const ty = nodeY(firstCol, i);
	      svg += '<line x1="' + (rootCX + 35) + '" y1="' + rootCY + '" x2="' + tx + '" y2="' + ty + '" class="tree-link" opacity="0.3"/>';
	    });
	  }

	  // Build flat sequential list
	  const flatNodes = [];
	  columns.forEach((col, c) => {
	    col.nodes.forEach((d, i) => {
	      flatNodes.push({ node: d, col: c, idx: i });
	    });
	  });

	  // Sequential chain links: DP1→DP2→DP3→...→DPn
	  for (let i = 0; i < flatNodes.length - 1; i++) {
	    const from = flatNodes[i];
	    const to = flatNodes[i + 1];
	    const fromNodes = columns[from.col].nodes;
	    const toNodes = columns[to.col].nodes;
	    const x1 = colX(from.col) + NODE_W / 2;
	    const y1 = nodeY(fromNodes, from.idx);
	    const x2 = colX(to.col) - NODE_W / 2;
	    const y2 = nodeY(toNodes, to.idx);
	    const sameCol = from.col === to.col;
	    svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" class="tree-link" opacity="' + (sameCol ? '0.3' : '0.5') + '" stroke-width="' + (sameCol ? '1' : '1.5') + '"/>';
	    if (!sameCol) {
	      svg += '<text x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 + 4) + '" text-anchor="middle" class="tree-label-sm" fill="var(--text-muted)" font-size="9">▶</text>';
	    }
	  }

	  // Links last decision → each ending
	  if (flatNodes.length > 0 && endings.length > 0) {
	    const lastNode = flatNodes[flatNodes.length - 1];
	    const lastNodes = columns[lastNode.col].nodes;
	    const lx = colX(lastNode.col) + NODE_W / 2;
	    const ly = nodeY(lastNodes, lastNode.idx);
	    endings.forEach((e, ei) => {
	      const ex = colX(endingsCol) - NODE_W / 2;
	      const ey = nodeY(endings, ei);
	      const ec = e.ending_type === 'good' ? '#27ae60' : e.ending_type === 'bad' ? '#c0392b' : '#d68910';
	      svg += '<line x1="' + lx + '" y1="' + ly + '" x2="' + ex + '" y2="' + ey + '" class="tree-link" stroke="' + ec + '" opacity="0.5" stroke-width="2"/>';
	      const label = e.ending_type === 'good' ? '✓真结局' : e.ending_type === 'bad' ? '✗坏结局' : '≈中性';
	      svg += '<text x="' + ((lx + ex) / 2) + '" y="' + ((ly + ey) / 2 - 4) + '" text-anchor="middle" class="tree-label-sm" fill="' + ec + '" font-size="9">' + label + '</text>';
	    });
	  }

	  // Draw decision nodes
	  columns.forEach((col, c) => {
	    col.nodes.forEach((d, i) => {
	      const cx = colX(c);
	      const cy = nodeY(col.nodes, i);
	      const x = cx - NODE_W / 2;
	      const y = cy - NODE_H / 2;
	      const bgColor = d.is_critical ? '#fde8e8' : '#fff';
	      svg += '<g class="tree-node' + (d.is_critical ? ' critical' : '') + '" data-id="' + d.decision_id + '" data-type="decision" onclick="treeToggleCollapse(\'' + d.decision_id + '\')">';
	      svg += '<rect x="' + x + '" y="' + y + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="6" fill="' + bgColor + '" stroke="' + (d.is_critical ? 'var(--danger)' : 'var(--accent-light)') + '" stroke-width="' + (d.is_critical ? 2.5 : 1.5) + '" class="tree-node-bg"/>';
	      const title = d.title.length > 12 ? d.title.slice(0, 12) + '…' : d.title;
	      svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" class="tree-label" font-weight="600">' + esc(d.decision_id) + ' ' + esc(title) + '</text>';
	      svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" class="tree-label-sm">' + esc(d.day_window) + ' | ' + (d.options || []).length + ' 选项</text>';
	      svg += '</g>';
	    });
	  });

	  // Ending nodes
	  if (endings.length) {
	    endings.forEach((e, i) => {
	      const cx = colX(endingsCol);
	      const cy = nodeY(endings, i);
	      const x = cx - NODE_W / 2;
	      const y = cy - NODE_H / 2;
	      const ec = e.ending_type === 'good' ? '#27ae60' : e.ending_type === 'bad' ? '#c0392b' : '#d68910';
	      const statusLabel = e.ending_type === 'good' ? '好结局' : e.ending_type === 'bad' ? '坏结局' : '中性';
	      svg += '<g class="tree-ending ' + e.ending_type + '" data-id="' + e.ending_id + '" data-type="ending">';
	      svg += '<rect x="' + x + '" y="' + y + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="20" fill="' + ec + '22" stroke="' + ec + '" stroke-width="2" class="tree-node-bg"/>';
	      svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" class="tree-label" font-weight="600">' + esc(e.title) + '</text>';
	      svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" class="tree-label-sm">' + statusLabel + ' | ' + (e.conditions || []).length + ' 条件</text>';
	      svg += '</g>';
	    });
	  }

	  svg += '</svg>';

	  const legend = '<div class="tree-legend">'
	    + '<span><span class="dot" style="background:var(--danger);"></span> 关键决策</span>'
	    + '<span><span class="dot" style="background:var(--accent-light);"></span> 普通决策</span>'
	    + '<span><span class="dot" style="background:var(--success);"></span> 好结局</span>'
	    + '<span><span class="dot" style="background:#d68910;"></span> 中性结局</span>'
	    + '<span><span class="dot" style="background:var(--danger);"></span> 坏结局</span>'
	    + '<span style="margin-left:8px;">🖱 拖拽平移 | 滚轮缩放 | 点击折叠</span>'
	    + '</div>';

	  panel.innerHTML = '<div class="tree-container" id="treeContainer">' + svg + '</div>' + legend;

	  // Tooltip
	  const oldTooltip = document.getElementById('treeTooltip');
	  if (oldTooltip) oldTooltip.remove();
	  const tooltip = document.createElement('div');
	  tooltip.className = 'tree-tooltip';
	  tooltip.id = 'treeTooltip';
	  panel.appendChild(tooltip);

	  const container = document.getElementById('treeContainer');
	  if (!container) return;
  container.addEventListener('mousedown', function(e) {
    treeState.dragging = true;
    treeState.startX = e.clientX - treeState.offsetX;
    treeState.startY = e.clientY - treeState.offsetY;
  });

  container.addEventListener('mouseover', function(e) {
    const g = e.target.closest('g[data-id]');
    if (!g) { tooltip.style.display = 'none'; return; }
    const id = g.dataset.id, type = g.dataset.type;
    let html = '';
    if (type === 'decision') {
      const dp = decisions.find(function(d) { return d.decision_id === id; });
      if (dp) {
        html = '<strong>' + esc(dp.decision_id) + ' ' + esc(dp.title) + '</strong><br>';
        html += '<small>' + esc(dp.day_window) + (dp.is_critical ? ' ★ 关键决策' : '') + '</small><br>';
        html += '<p style="margin:4px 0;">' + esc(dp.situation) + '</p>';
        html += (dp.options || []).map(function(o) { return '· ' + esc(o.label) + ': ' + esc(o.description).slice(0, 40) + '…'; }).join('<br>');
      }
    } else if (type === 'ending') {
      const ending = endings.find(function(e) { return e.ending_id === id; });
      if (ending) {
        const sl = ending.ending_type === 'good' ? '好结局' : ending.ending_type === 'bad' ? '坏结局' : '中性';
        html = '<strong>' + esc(ending.title) + '</strong> <span style="color:var(--text-muted);">' + sl + '</span><br>';
        html += '<p style="margin:4px 0;">' + esc(ending.description) + '</p>';
        html += (ending.conditions || []).map(function(c) { return '📋 ' + esc(c); }).join('<br>');
      }
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.offsetX + 15) + 'px';
    tooltip.style.top = (e.offsetY - 10) + 'px';
  });

  container.addEventListener('mouseout', function(e) {
    if (!e.target.closest('g[data-id]')) tooltip.style.display = 'none';
  });

  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    treeState.scale = Math.max(0.3, Math.min(3, treeState.scale - e.deltaY * 0.001));
    const svgEl = container.querySelector('svg');
    if (svgEl) svgEl.style.transform = 'translate(' + treeState.offsetX + 'px, ' + treeState.offsetY + 'px) scale(' + treeState.scale + ')';
  });
}

function treeToggleCollapse(decisionId) {
  treeState.collapsed[decisionId] = !treeState.collapsed[decisionId];
  if (lastResult && lastResult.script) renderTree(lastResult.script);
}

// ===== 分步生成 API =====

async function startMdGeneration() {
  const scenario = document.getElementById('scenario').value.trim();
  const playerRole = document.getElementById('playerRole').value.trim();
  const learningGoal = document.getElementById('learningGoal').value.trim();
  if (!scenario || !playerRole || !learningGoal) {
    showError('请填写政策场景、玩家角色和教育目标');
    return;
  }

  hide('error-card'); hide('result-card');
  const btn = document.getElementById('generateMdBtn');
  setButtonLoading(btn, true);
  btn.dataset.origText = '📝 生成剧本 MD';
  activeAbortController = new AbortController();

  try {
    const resp = await fetch('/api/generate-md', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scenario, player_role: playerRole, learning_goal: learningGoal,
        duration_minutes: parseInt(document.getElementById('duration').value),
        complexity: document.getElementById('complexity').value,
        npc_count: parseInt(document.getElementById('npcCount').value),
        chapter_count: parseInt(document.getElementById('chapterCount').value),
        ending_count: parseInt(document.getElementById('endingCount').value),
        character_settings: document.getElementById('characterSettings').value.trim(),
        story_background: document.getElementById('storyBackground').value.trim(),
        extra_requirements: document.getElementById('extra').value.trim(),
      }),
      signal: activeAbortController.signal,
    });
    activeTaskId = resp.headers.get('X-Task-Id');
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '请求失败 ' + resp.status);
    }

    for await (const { event, data } of readSSE(resp)) {
      if (event === 'progress') {
        setProgress(data.stage, data.total, data.name);
      } else if (event === 'result') {
        lastFullMD = normalizeFullMD(data.full_md) || '';
        lastResult = data;
                if (data.script) {
          renderResult(data);
        } else {
          show('result-card');
          document.getElementById('panel-overview').innerHTML = '<p style="color:var(--text-muted); padding:20px; text-align:center;">📝 剧本原文已生成<br><small>请审核后点击「📦 提取结构化 JSON」完成结构化提取</small></p>';
          document.getElementById('panel-npcs').innerHTML = '';
          document.getElementById('panel-tree').innerHTML = '';
          document.getElementById('panel-mdtext').innerHTML = '';
          updateVersionLabel(data.saved_as || '');
        }
        hide('progress-card');
      } else if (event === 'error') {
        showError(data.message);
      } else if (event === 'cancelled') {
        hide('progress-card');
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') showError(err.message);
  } finally {
    setButtonLoading(btn, false);
    btn.textContent = '📝 生成剧本 MD';
    btn.disabled = false;
    activeAbortController = null;
    activeTaskId = null;
  }
}

async function startOneClickGeneration() {
  return startGeneration();
}

async function extractFromMD() {
  const fullMd = document.getElementById('mdEditor').value.trim();
  if (!fullMd) { showError('没有可提取的剧本原文'); return; }

  hide('error-card');
  const btn = document.getElementById('extractBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 提取中...';

  activeAbortController = new AbortController();

  try {
    const resp = await fetch('/api/extract-from-md', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_md: fullMd,
        npc_count: parseInt(document.getElementById('npcCount').value),
        query: lastResult ? (lastResult.original_query || '') : '',
        scenario: document.getElementById('scenario').value.trim(),
        player_role: document.getElementById('playerRole').value.trim(),
        learning_goal: document.getElementById('learningGoal').value.trim(),
      }),
      signal: activeAbortController.signal,
    });
    activeTaskId = resp.headers.get('X-Task-Id');
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '提取失败 ' + resp.status);
    }

    show('progress-card');
    for await (const { event, data } of readSSE(resp)) {
      if (event === 'progress') {
        setProgress(data.stage, data.total, data.name);
      } else if (event === 'result') {
        lastResult = data;
        lastFullMD = normalizeFullMD(data.full_md) || fullMd;
        renderResult(data);
        hide('progress-card');
        show('result-card');
        updateVersionLabel(data.saved_as || '');
              } else if (event === 'error') {
        showError(data.message);
      } else if (event === 'cancelled') {
        hide('progress-card');
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') showError(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📦 提取结构化 JSON';
    activeAbortController = null;
    activeTaskId = null;
  }
}


function renderMarkdown(md) {
  if (!md) return '';
  let html = '';
  const lines = md.split('\n');
  let inList = false;
  let inBlockquote = false;
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    
    // Empty line
    if (!line.trim()) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      continue;
    }
    
    // Headings
    if (line.match(/^### /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h3 style="margin:16px 0 8px; color:var(--accent); font-size:16px;">' + processInline(line.slice(4)) + '</h3>';
      continue;
    }
    if (line.match(/^## /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h2 style="margin:20px 0 10px; color:var(--accent); font-size:18px; border-bottom:1px solid var(--border); padding-bottom:6px;">' + processInline(line.slice(3)) + '</h2>';
      continue;
    }
    if (line.match(/^# /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h1 style="margin:24px 0 12px; color:var(--accent); font-size:20px;">' + processInline(line.slice(2)) + '</h1>';
      continue;
    }
    
    // Horizontal rule
    if (line.match(/^---+$/)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">';
      continue;
    }
    
    // Blockquote
    if (line.match(/^> /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inBlockquote) { html += '<blockquote style="margin:8px 0; padding:8px 16px; border-left:3px solid var(--accent-light); background:#fdfaf5; border-radius:0 var(--radius) var(--radius) 0;">'; inBlockquote = true; }
      html += '<p style="margin:4px 0; color:var(--text-muted);">' + processInline(line.slice(2)) + '</p>';
      continue;
    }
    
    // Unordered list
    if (line.match(/^[-*] /)) {
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      if (!inList) { html += '<ul style="margin:4px 0; padding-left:24px;">'; inList = true; }
      html += '<li style="margin:2px 0;">' + processInline(line.slice(2)) + '</li>';
      continue;
    }
    
    // Data point / special markup
    if (line.match(/^> \*\*/) || line.match(/^> \*\*/)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inBlockquote) { html += '<blockquote style="margin:8px 0; padding:8px 16px; border-left:3px solid var(--accent-light); background:#fdfaf5; border-radius:0 var(--radius) var(--radius) 0;">'; inBlockquote = true; }
      html += '<p style="margin:4px 0; color:var(--text-muted);">' + processInline(line.replace(/^> /, '')) + '</p>';
      continue;
    }
    
    // Regular paragraph
    if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
    if (inList) { html += '</ul>'; inList = false; }
    html += '<p style="margin:4px 0;">' + processInline(line) + '</p>';
  }
  
  if (inList) html += '</ul>';
  if (inBlockquote) html += '</blockquote>';
  return html;
}

function processInline(text) {
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--accent);">$1</strong>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code style="background:var(--bg); padding:1px 5px; border-radius:3px; font-size:0.9em;">$1</code>');
  // Em dash
  text = text.replace(/---/g, '—');
  return text;
}

function toggleMdEdit() {
  const rendered = document.getElementById('mdRendered');
  const editor = document.getElementById('mdEditor');
  const btn = document.getElementById('mdEditToggle');
  if (!rendered || !editor) return;
  if (editor.style.display === 'none') {
    // Switch to edit mode
    rendered.style.display = 'none';
    editor.style.display = 'block';
    btn.textContent = '👁 预览';
    editor.value = lastFullMD || '';
  } else {
    // Switch to preview mode
    lastFullMD = editor.value;
    rendered.innerHTML = renderMarkdown(lastFullMD);
    rendered.style.display = 'block';
    editor.style.display = 'none';
    btn.textContent = '✏️ 编辑';
  }
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}
