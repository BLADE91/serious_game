<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本生成器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<style>
:root {
  --bg: #f5f0eb;
  --card: #fff;
  --text: #2c2416;
  --text-muted: #6b5e4a;
  --accent: #8b4513;
  --accent-light: #d4a574;
  --danger: #c0392b;
  --success: #27ae60;
  --neutral: #8e7c5e;
  --border: #e0d5c7;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(44,36,22,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

header { text-align: center; padding: 32px 0 16px; }
header h1 { font-size: 28px; color: var(--accent); letter-spacing: 2px; }
header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
.card h2 { font-size: 16px; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 500; }
input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); transition: border-color .2s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; }
.btn-primary:hover { background: #6b3410; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-sm { padding: 6px 14px; font-size: 13px; }

.progress-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.progress-text { font-size: 13px; color: var(--text-muted); }
.progress-log { margin-top: 10px; max-height: 132px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); padding: 8px 10px; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.progress-log div + div { margin-top: 4px; }

.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; background: var(--bg); color: var(--text-muted); border: 1px solid transparent; transition: all .2s; }
.tab.active { background: var(--card); color: var(--accent); border-color: var(--border); border-bottom-color: var(--card); margin-bottom: -2px; font-weight: 600; }

.panel { display: none; }
.panel.active { display: block; }

.act-card { border-left: 3px solid var(--accent-light); padding: 12px 16px; margin-bottom: 12px; background: var(--bg); border-radius: 0 var(--radius) var(--radius) 0; overflow: hidden; }
.act-card h3 { font-size: 15px; color: var(--accent); margin-bottom: 4px; }
.act-card .act-meta { font-size: 12px; color: var(--text-muted); }

.npc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.npc-chip { padding: 8px 12px; background: var(--bg); border-radius: var(--radius); font-size: 13px; border: 1px solid var(--border); }
.npc-chip .name { font-weight: 600; color: var(--accent); }
.npc-chip .type { font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
.type-cadre { background: #e74c3c22; color: #c0392b; }
.type-external { background: #f39c1222; color: #d68910; }
.type-villager { background: #27ae6022; color: #1e8449; }

.rel-group { margin-bottom: 12px; }
.rel-group h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.rel-item { font-size: 13px; padding: 4px 0; border-bottom: 1px dotted var(--border); display: flex; gap: 8px; align-items: baseline; }
.rel-item .arrow { color: var(--text-muted); }
.rel-item .desc { color: var(--text-muted); font-size: 12px; }

.decision-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; overflow: hidden; }
.decision-card.critical { border-left: 3px solid var(--danger); }
.decision-card h3 { font-size: 15px; }
.decision-card .dp-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.decision-card .situation { font-size: 14px; margin-bottom: 12px; padding: 10px; background: var(--bg); border-radius: var(--radius); }

.option-card { padding: 10px 14px; margin: 6px 0; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; overflow: hidden; }
.option-card .opt-cost { font-size: 11px; color: var(--text-muted); float: right; }
.option-card .opt-risk { color: var(--danger); font-size: 12px; margin-top: 4px; }

.ending-card { border-left: 4px solid var(--neutral); padding: 12px 16px; margin-bottom: 12px; background: var(--bg); border-radius: 0 var(--radius) var(--radius) 0; overflow: hidden; }
.ending-card.good { border-color: var(--success); }
.ending-card.bad { border-color: var(--danger); }
.ending-card h3 { font-size: 15px; }
.ending-card .conditions { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.feedback-area { display: flex; gap: 8px; margin-top: 12px; }
.feedback-area input { flex: 1; }
.revision-toolbar { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: end; }
.revision-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.revision-actions .btn-primary { width: auto; }
.batch-source-workspace { display: grid; grid-template-columns: minmax(190px, 240px) minmax(0, 1fr); gap: 14px; align-items: start; }
.batch-source-sidebar { max-height: 430px; overflow: auto; border-right: 1px solid var(--border); padding-right: 12px; }
.batch-source-select-all { display: flex; align-items: center; gap: 8px; padding: 8px 4px; font-size: 12px; font-weight: 600; }
.batch-source-select-all input[type="checkbox"], .batch-source-item input[type="checkbox"] { width: auto; padding: 0; }
.batch-source-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 7px; align-items: center; width: 100%; padding: 8px 4px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--text); text-align: left; cursor: pointer; }
.batch-source-item.active { color: var(--accent); font-weight: 600; }
.batch-source-item small { display: block; color: var(--text-muted); font-weight: 400; }
.batch-source-item.dirty small { color: var(--danger); }
.batch-source-editor-header { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 28px; }
.batch-source-editor textarea { width: 100%; min-height: 390px; margin-top: 8px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; line-height: 1.65; resize: vertical; }
.element-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.element-actions { display: inline-flex; flex: 0 0 auto; gap: 4px; }
.element-action { padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text-muted); font-size: 11px; line-height: 1.5; cursor: pointer; white-space: nowrap; }
.element-action:hover { border-color: var(--accent-light); color: var(--accent); }
.source-revision-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(30, 25, 20, .56); }
.source-inline-editor { width: min(920px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; border: 1px solid var(--accent-light); border-radius: var(--radius); background: var(--card); box-shadow: 0 18px 60px rgba(30, 25, 20, .28); }
.source-inline-editor textarea { width: 100%; min-height: min(52vh, 520px); max-height: 62vh; overflow: auto; margin-top: 10px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; line-height: 1.65; }
.source-inline-header, .source-inline-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.source-inline-header strong { color: var(--accent); font-size: 15px; }
.source-inline-ai { display: flex; gap: 8px; margin-top: 8px; }
.source-inline-ai input { flex: 1; }
.source-inline-actions { justify-content: flex-end; margin-top: 8px; }
.source-inline-actions .btn-primary { width: auto; }
.source-inline-status { min-height: 18px; margin-top: 6px; color: var(--text-muted); font-size: 11px; }
body.modal-open { overflow: hidden; }
.collapsible-text { max-height: 4.8em; overflow: hidden; white-space: pre-wrap; }
.collapsible-text.expanded { max-height: none; }
.text-toggle { margin-top: 4px; padding: 0; border: 0; background: transparent; color: var(--accent); font-size: 11px; cursor: pointer; }

.hidden { display: none; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-good { background: #27ae6022; color: #1e8449; }
.badge-neutral { background: #f39c1222; color: #d68910; }
.badge-bad { background: #e74c3c22; color: #c0392b; }

@media (max-width: 640px) {
  .container { padding: 12px 8px; }
  .card { padding: 16px 12px; }
  .form-grid, .revision-toolbar, .batch-source-workspace { grid-template-columns: 1fr; }
  .batch-source-sidebar { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: 8px; }
  .form-grid .full { grid-column: auto; }
  .feedback-area { flex-direction: column; }
  .revision-actions .btn, .feedback-area .btn { width: 100%; justify-content: center; }
  .source-inline-ai { flex-direction: column; }
  .source-inline-ai .btn { width: 100%; justify-content: center; }
  .tabs { overflow-x: auto; }
  .tab { flex: 0 0 auto; padding: 8px 12px; }
  .act-card { overflow-x: auto; }
}

</style>
</head>
<body>
<div class="container">

<header>
  <h1>🏛️ 剧本生成器</h1>
  <p>严肃游戏结构化剧本生成与修订工具</p>
</header>

<!-- 输入区 -->
<div class="card" id="input-card">
  <h2>📝 剧本参数</h2>
  <div class="form-grid">
    <div>
      <label for="scenario">政策场景 *</label>
      <input id="scenario" placeholder="如：生态搬迁、征地拆迁" value="生态搬迁">
    </div>
    <div>
      <label for="playerRole">玩家角色 *</label>
      <input id="playerRole" placeholder="如：乡镇党委副书记" value="乡镇党委副书记">
    </div>
    <div class="full">
      <label for="learningGoal">教育目标 *</label>
      <input id="learningGoal" placeholder="如：体验基层政策执行中多重压力的权衡与抉择" value="体验基层政策执行中多重压力的权衡与抉择">
    </div>
    <div>
      <label for="duration">目标时长</label>
      <select id="duration">
        <option value="30">30 分钟</option>
        <option value="45" selected>45 分钟</option>
        <option value="60">60 分钟</option>
        <option value="90">90 分钟</option>
      </select>
    </div>
    <div>
      <label for="complexity">复杂度</label>
      <select id="complexity">
        <option value="simple">简单</option>
        <option value="medium" selected>中等</option>
        <option value="complex">复杂</option>
      </select>
    </div>
    <div>
      <label for="npcCount">NPC 数量</label>
      <input type="number" id="npcCount" value="12" min="1" placeholder="如 12">
    </div>
    <div>
      <label for="chapterCount">章节数量</label>
      <input type="number" id="chapterCount" value="6" min="1" placeholder="如 6">
    </div>
    <div>
      <label for="endingCount">结局数量</label>
      <input type="number" id="endingCount" value="4" min="1" placeholder="如 4">
    </div>
    <div>
      <label for="decisionPointCount">每章决策点数量</label>
      <input type="number" id="decisionPointCount" value="3" min="1" placeholder="如 3">
    </div>
    <div class="full">
      <label for="characterSettings">人物设定（可选）</label>
      <input id="characterSettings" placeholder="如：县委书记是改革派，村支书是保守派，两个家族有世仇…">
    </div>
    <div class="full">
      <label for="storyBackground">故事背景（可选）</label>
      <textarea id="storyBackground" placeholder="如：2024年，某县因水源地保护需要搬迁3个村共36户居民，县财政紧张，上级要求年底前完成…"></textarea>
    </div>
    <div class="full">
      <label for="extra">额外要求（可选）</label>
      <textarea id="extra" placeholder="如：需要涉及宗族矛盾、加入媒体监督角色"></textarea>
    </div>
  </div>
  <div style="display:flex; gap:12px;">
    <button class="btn btn-primary" id="oneClickBtn" onclick="startOneClickGeneration()" style="flex:1;">
      ⚡ 一键生成
    </button>
    <button class="btn btn-secondary" id="resumeBtn" onclick="openResumeVersionPicker()">
      ↻ 续跑
    </button>
    <button class="btn btn-secondary" id="loadBtn" onclick="loadLatestResult()">
      📂 加载
    </button>
    <button class="btn btn-secondary" id="rebuildSourcesBtn" onclick="openSourceRebuildPicker()">
      ↻ 审查并重建
    </button>
  </div>
</div>

<!-- 进度区 -->
<div class="card hidden" id="progress-card">
  <h2>⏳ 生成进度</h2>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <p class="progress-text" id="progressText">准备中...</p>
  <div class="progress-log hidden" id="progressLog"></div>
  <button class="btn btn-secondary btn-sm" id="cancelBtn" onclick="cancelGeneration()" style="margin-top:12px;">⏹ 取消任务</button>
</div>

<!-- 结果区 -->
<div class="card hidden" id="result-card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div>
      <h2 style="margin:0; padding:0; border:none; display:inline;">📋 生成结果</h2>
      <span id="currentVersionLabel" style="display:none; margin-left:8px; font-size:12px; color:var(--accent); background:var(--bg); padding:3px 10px; border-radius:4px; font-weight:600;"></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn btn-secondary btn-sm" onclick="downloadResult()">📥 下载 JSON</button>
      <button class="btn btn-secondary btn-sm" id="versionsBtn" onclick="toggleVersions()">📜 版本历史</button>
    </div>
  </div>
  <div class="card hidden" id="versions-card" style="margin-bottom:16px; padding:16px;">
    <h3 style="font-size:14px; margin-bottom:8px;">📜 版本历史</h3>
    <div id="versionsList" style="max-height:200px; overflow-y:auto; font-size:13px;"></div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-panel="overview">📊 概览</div>
    <div class="tab" data-panel="npcs">👥 NPC 网络</div>
    <div class="tab" data-panel="tree">🌳 剧情结构</div>
    <div class="tab" data-panel="mdtext">📝 剧本原文</div>
  </div>
  <div id="panel-overview" class="panel active"></div>
  <div id="panel-npcs" class="panel"></div>
  <div id="panel-tree" class="panel"></div>
  <div id="panel-mdtext" class="panel"></div>

  <!-- 章节式源文件修订 -->
  <div id="chapterRevisionControls" class="hidden" style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border);">
    <h3 style="font-size:15px; margin-bottom:12px;">章节源文件修订</h3>
    <div class="revision-toolbar">
      <div class="revision-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadRevisionSources()">重新加载源文件</button>
        <button class="btn btn-secondary btn-sm" id="discardBatchRevisionBtn" onclick="discardBatchRevision()" disabled>放弃全部修改</button>
        <button class="btn btn-primary btn-sm" id="applyBatchRevisionBtn" onclick="submitBatchRevision()">提交全部修改并重建</button>
      </div>
    </div>
    <div class="batch-source-workspace" style="margin-top:10px;">
      <div class="batch-source-sidebar">
        <label class="batch-source-select-all">
          <input type="checkbox" id="selectAllRevisionSources" onchange="toggleAllRevisionSources(this.checked)">
          <span>全选源文件</span>
        </label>
        <div id="revisionSourceList"></div>
      </div>
      <div class="batch-source-editor">
        <div class="batch-source-editor-header">
          <strong id="activeRevisionSourceLabel">请选择源文件</strong>
          <span id="activeRevisionSourceState" class="status-badge"></span>
        </div>
        <textarea id="revisionSourceEditor" oninput="updateActiveRevisionDraft()" disabled></textarea>
      </div>
    </div>
    <div class="feedback-area" style="margin-top:10px;">
      <input id="chapterAiFeedback" placeholder="输入针对当前源文件的 AI 修订意见">
      <button class="btn btn-secondary btn-sm" onclick="previewAiRevision()">AI 生成候选</button>
    </div>
    <div id="revisionPreview" class="hidden" style="margin-top:12px;">
      <h4 style="font-size:13px; margin-bottom:6px;">修改差异</h4>
      <pre id="revisionDiff" style="max-height:320px; overflow:auto; white-space:pre-wrap; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); font-size:12px;"></pre>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="btn btn-secondary btn-sm" onclick="clearRevisionPreview()">取消预览</button>
        <button class="btn btn-primary btn-sm" id="applyRevisionBtn" onclick="applyChapterRevision()">应用到草稿</button>
      </div>
    </div>
  </div>

</div>

<!-- 错误区 -->
<div class="card hidden" id="error-card" style="border-left:4px solid var(--danger);">
  <h2>❌ 出错了</h2>
  <p id="errorText" style="color:var(--danger);"></p>
</div>

</div>

<script>
// ===== 全局状态 =====
let lastResult = null;
let activeAbortController = null;
let activeTaskId = null;
let revisionPreviewData = null;
let revisionSources = {};
let revisionDrafts = {};
let revisionSourceMeta = {};
let selectedRevisionSources = new Set();
let activeRevisionTarget = '';
let inlineRevisionContext = null;
let inlineRevisionRequestId = 0;

// ===== Tab 切换 =====
document.getElementById('tabs')?.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('panel-' + tab.dataset.panel)?.classList.add('active');
});

// ===== SSE 流读取 =====
async function* readSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let eventType = '';
  let dataBuffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';

    for (const line of lines) {
      if (line.startsWith('event:')) {
        eventType = line.slice(6).trim();
      } else if (line.startsWith('data:')) {
        dataBuffer = line.slice(5).trim();
      } else if (line === '' && eventType && dataBuffer) {
        try {
          yield { event: eventType, data: JSON.parse(dataBuffer) };
        } catch {
          yield { event: eventType, data: dataBuffer };
        }
        eventType = '';
        dataBuffer = '';
      }
    }
  }
}

// ===== UI 控制 =====
function show(id) { document.getElementById(id)?.classList.remove('hidden'); }
function hide(id) { document.getElementById(id)?.classList.add('hidden'); }
function setProgress(stage, total, name) {
  show('progress-card');
  const pct = Math.round((stage / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `阶段 ${stage}/${total}：${name}`;
  appendProgressLog(`阶段 ${stage}/${total}：${name}`);
}
function appendProgressLog(message) {
  const log = document.getElementById('progressLog');
  if (!log || !message) return;
  show('progressLog');
  const last = log.lastElementChild?.textContent || '';
  if (last === message) return;
  const row = document.createElement('div');
  row.textContent = message;
  log.appendChild(row);
  while (log.children.length > 10) log.removeChild(log.firstElementChild);
  log.scrollTop = log.scrollHeight;
}
function resetProgressLog() {
  const log = document.getElementById('progressLog');
  if (!log) return;
  log.innerHTML = '';
  hide('progressLog');
}
function showError(msg) {
  show('error-card');
  document.getElementById('errorText').textContent = msg;
  hide('progress-card');
}

function setButtonLoading(btn, loading) {
  if (loading) {
    btn.disabled = true;
    btn.dataset.origText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span> 生成中...';
  } else {
    btn.disabled = false;

function getRevisionBaseVersion() {
  return lastResult?.revision_dir || lastResult?.filename || lastResult?.saved_as || '';
}

function configureChapterRevision(chapters) {
  show('chapterRevisionControls');
  clearRevisionPreview();
  loadRevisionSources();
}

async function loadRevisionSources() {
  const baseVersion = getRevisionBaseVersion();
  if (!baseVersion) return;
  clearRevisionPreview();
  try {
    const params = new URLSearchParams({base_version: baseVersion});
    const resp = await fetch(`/api/revisions/sources?${params}`);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || `读取源文件失败 ${resp.status}`);
    revisionSources = {};
    revisionDrafts = {};
    revisionSourceMeta = {};
    selectedRevisionSources = new Set();
    for (const source of data.sources || []) {
      revisionSources[source.target] = source.content || '';
      revisionDrafts[source.target] = source.content || '';
      revisionSourceMeta[source.target] = source;
      selectedRevisionSources.add(source.target);
    }
    activeRevisionTarget = (data.sources || [])[0]?.target || '';
    renderRevisionSourceList();
    showActiveRevisionSource();
    syncBatchRevisionState();
  } catch (err) {
    showError(err.message);
  }
}

function renderRevisionSourceList() {
  const list = document.getElementById('revisionSourceList');
  const targets = Object.keys(revisionSourceMeta);
  list.innerHTML = targets.map(target => {
    const meta = revisionSourceMeta[target];
    const dirty = revisionDrafts[target] !== revisionSources[target];
    const checked = selectedRevisionSources.has(target);
    const label = target === 'game_settings'
      ? '全局设定'
      : target === 'chapter_outline' ? '章节大纲' : target.toUpperCase();
    return `
      <div class="batch-source-item ${target === activeRevisionTarget ? 'active' : ''} ${dirty ? 'dirty' : ''}" onclick="activateRevisionSource('${esc(target)}')">
        <input type="checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleRevisionSource('${esc(target)}', this.checked)">
        <span>${esc(label)}<small>${dirty ? '已修改' : esc(meta.filename || '')}</small></span>
      </div>`;
  }).join('');
  const all = targets.length > 0 && targets.every(target => selectedRevisionSources.has(target));
  const checkbox = document.getElementById('selectAllRevisionSources');
  checkbox.checked = all;
  checkbox.indeterminate = !all && targets.some(target => selectedRevisionSources.has(target));
}

function activateRevisionSource(target) {
  if (!(target in revisionDrafts)) return;
  activeRevisionTarget = target;
  clearRevisionPreview();
  renderRevisionSourceList();
  showActiveRevisionSource();
}

function showActiveRevisionSource() {
  const editor = document.getElementById('revisionSourceEditor');
  const meta = revisionSourceMeta[activeRevisionTarget];
  editor.disabled = !meta;
  editor.value = meta ? revisionDrafts[activeRevisionTarget] : '';
  document.getElementById('activeRevisionSourceLabel').textContent = meta
    ? meta.filename : '请选择源文件';
  const dirty = meta && revisionDrafts[activeRevisionTarget] !== revisionSources[activeRevisionTarget];
  const state = document.getElementById('activeRevisionSourceState');
  state.textContent = dirty ? '已修改' : '';
  state.className = dirty ? 'status-badge badge-bad' : 'status-badge';
}

function updateActiveRevisionDraft() {
  if (!activeRevisionTarget) return;
  revisionDrafts[activeRevisionTarget] = document.getElementById('revisionSourceEditor').value;
  selectedRevisionSources.add(activeRevisionTarget);
  renderRevisionSourceList();
  showActiveRevisionSource();
  syncBatchRevisionState();
}

function toggleRevisionSource(target, checked) {
  if (checked) selectedRevisionSources.add(target);
  else selectedRevisionSources.delete(target);
  renderRevisionSourceList();
  syncBatchRevisionState();
}

function toggleAllRevisionSources(checked) {
  selectedRevisionSources = checked
    ? new Set(Object.keys(revisionSourceMeta))
    : new Set();
  renderRevisionSourceList();
  syncBatchRevisionState();
}

function syncBatchRevisionState() {
  const dirtyTargets = Object.keys(revisionDrafts).filter(
    target => revisionDrafts[target] !== revisionSources[target]
  );
  const selectedDirtyCount = dirtyTargets.filter(
    target => selectedRevisionSources.has(target)
  ).length;
  document.getElementById('discardBatchRevisionBtn').disabled = dirtyTargets.length === 0;
  document.getElementById('applyBatchRevisionBtn').disabled = selectedDirtyCount === 0;
}

function discardBatchRevision() {
  revisionDrafts = {...revisionSources};
  clearRevisionPreview();
  renderRevisionSourceList();
  showActiveRevisionSource();
  syncBatchRevisionState();
}

async function fetchRevisionSource(target) {
  if (target in revisionDrafts) return revisionDrafts[target];
  const params = new URLSearchParams({
    base_version: getRevisionBaseVersion(),
    target,
  });
  const resp = await fetch(`/api/revisions/source?${params}`);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || `读取源文件失败 ${resp.status}`);
  return data.content || '';
}

function revisionActionButtons(target, marker, field) {
  if (!target || !marker) return '';
  return `
    <span class="element-actions">
      <button type="button" class="element-action" data-revision-target="${esc(target)}" data-revision-marker="${esc(marker)}" data-revision-field="${esc(field || '')}" data-revision-mode="edit" onclick="openInlineRevision(this)" title="在当前位置编辑对应 Markdown 内容块">编辑</button>
      <button type="button" class="element-action" data-revision-target="${esc(target)}" data-revision-marker="${esc(marker)}" data-revision-field="${esc(field || '')}" data-revision-mode="ai" onclick="openInlineRevision(this)" title="在当前位置生成该元素的 AI 修订候选">AI 修订</button>
    </span>
  `;
}

function collapsibleText(value, limit = 120) {
  const text = String(value || '');
  if (!text) return '';
  if (text.length <= limit) return `<div>${esc(text)}</div>`;
  return `
    <div class="collapsible-text">${esc(text)}</div>
    <button type="button" class="text-toggle" onclick="toggleLongText(this)">展开</button>
  `;
}

function toggleLongText(button) {
  const content = button.previousElementSibling;
  const expanded = content.classList.toggle('expanded');
  button.textContent = expanded ? '收起' : '展开';
}

function findMarkdownBlock(content, marker, field = '') {
  const escapePattern = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let markerIndex = -1;
  if (field) {
    const declarationPattern = new RegExp(
      `^\\s*-\\s*(?:\\*\\*)?${escapePattern(field)}\\s*:\\s*(?:\\*\\*)?\\s*\`?${escapePattern(marker)}\`?\\s*$`,
      'm',
    );
    const declaration = declarationPattern.exec(content);
    markerIndex = declaration ? declaration.index : -1;
  }
  if (markerIndex < 0) markerIndex = content.indexOf(marker);
  if (markerIndex < 0) return null;

  const headings = [];
  const pattern = /^(#{1,6})\s+.+$/gm;
  let match;
  while ((match = pattern.exec(content)) !== null) {
    headings.push({index: match.index, level: match[1].length});
  }
  const startHeading = headings.filter(heading => heading.index <= markerIndex).pop();
  if (!startHeading) {
    const lineStart = content.lastIndexOf('\n', markerIndex) + 1;
    const lineEnd = content.indexOf('\n', markerIndex);
    const end = lineEnd >= 0 ? lineEnd + 1 : content.length;
    return {start: lineStart, end, text: content.slice(lineStart, end)};
  }
  const nextHeading = headings.find(heading =>
    heading.index > startHeading.index && heading.level <= startHeading.level);
  const end = nextHeading ? nextHeading.index : content.length;
  return {
    start: startHeading.index,
    end,
    text: content.slice(startHeading.index, end).trimEnd(),
  };
}

function closeInlineRevision() {
  inlineRevisionRequestId += 1;
  document.querySelector('.source-revision-overlay')?.remove();
  document.body.classList.remove('modal-open');
  inlineRevisionContext = null;
}

async function openInlineRevision(button) {
  const target = button.dataset.revisionTarget;
  const marker = button.dataset.revisionMarker;
  const field = button.dataset.revisionField;
  const mode = button.dataset.revisionMode;
  closeInlineRevision();
  const requestId = ++inlineRevisionRequestId;
  hide('error-card');

  try {
    const source = await fetchRevisionSource(target);
    if (requestId !== inlineRevisionRequestId) return;
    const block = findMarkdownBlock(source, marker, field);
    if (!block) throw new Error(`源文件中找不到元素 ${marker}`);

    const overlay = document.createElement('div');
    overlay.className = 'source-revision-overlay';
    const panel = document.createElement('div');
    panel.className = 'source-inline-editor';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-label', `修订 ${marker}`);
    panel.innerHTML = `
      <div class="source-inline-header">
        <strong>${esc(marker)}</strong>
        <button type="button" class="element-action" onclick="closeInlineRevision()">关闭</button>
      </div>
      <textarea class="source-inline-text">${esc(block.text)}</textarea>
      <div class="source-inline-ai">
        <input class="source-inline-feedback" placeholder="输入仅针对 ${esc(marker)} 的修订意见">
        <button type="button" class="btn btn-secondary btn-sm" onclick="generateInlineAiRevision(this)">生成候选</button>
      </div>
      <div class="source-inline-status"></div>
      <div class="source-inline-actions">
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeInlineRevision()">取消</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="saveInlineRevision(this)">保存并重建</button>
      </div>
    `;
    overlay.appendChild(panel);
    overlay.addEventListener('click', event => {
      if (event.target === overlay) closeInlineRevision();
    });
    overlay.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeInlineRevision();
    });
    document.body.appendChild(overlay);
    document.body.classList.add('modal-open');

    inlineRevisionContext = {
      target,
      marker,
      field,
      source,
      start: block.start,
      end: block.end,
      mode: 'manual',
      feedback: '',
      panel,
    };
    if (mode === 'ai') {
      panel.querySelector('.source-inline-feedback').focus();
    } else {
      panel.querySelector('.source-inline-text').focus();
    }
  } catch (err) {
    if (requestId === inlineRevisionRequestId) showError(err.message);
  }
}

async function generateInlineAiRevision(button) {
  const context = inlineRevisionContext;
  if (!context) return;
  const panel = context.panel;
  const feedbackInput = panel.querySelector('.source-inline-feedback');
  const status = panel.querySelector('.source-inline-status');
  const feedback = feedbackInput.value.trim();
  if (!feedback) {
    status.textContent = '请先输入修订意见';
    feedbackInput.focus();
    return;
  }

  button.disabled = true;
  status.textContent = '正在生成局部候选...';
  try {
    const scopedFeedback = `仅修订元素 ${context.marker} 所属内容块：${feedback}`;
    const resp = await fetch('/api/revisions/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        base_version: getRevisionBaseVersion(),
        target: context.target,
        mode: 'ai',
        feedback: scopedFeedback,
        content: context.source,
        draft_sources: getChangedRevisionDrafts(),
      }),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || `生成局部候选失败 ${resp.status}`);
    const revisedBlock = findMarkdownBlock(
      data.revised_content || '',
      context.marker,
      context.field,
    );
    if (!revisedBlock) throw new Error(`AI 候选丢失了元素 ID ${context.marker}`);
    panel.querySelector('.source-inline-text').value = revisedBlock.text;
    context.mode = 'ai';
    context.feedback = scopedFeedback;
    status.textContent = data.changed ? 'AI 候选已填入，请确认后保存' : 'AI 未产生修改';
  } catch (err) {
    status.textContent = err.message;
  } finally {
    button.disabled = false;
  }
}

function saveInlineRevision(button) {
  const context = inlineRevisionContext;
  if (!context) return;
  const panel = context.panel;
  const status = panel.querySelector('.source-inline-status');
  const blockText = panel.querySelector('.source-inline-text').value.trim();
  if (!blockText) {
    status.textContent = '局部内容不能为空';
    return;
  }
  const originalBlock = context.source.slice(context.start, context.end).trim();
  if (blockText === originalBlock) {
    status.textContent = '内容没有变化';
    return;
  }

  const separator = context.end < context.source.length ? '\n\n' : '\n';
  const content = context.source.slice(0, context.start)
    + blockText.replace(/\s+$/, '') + separator
    + context.source.slice(context.end);
  stageRevisionDraft(context.target, content);
  closeInlineRevision();
}

function clearRevisionPreview() {
  revisionPreviewData = null;
  hide('revisionPreview');
  const diff = document.getElementById('revisionDiff');
  if (diff) diff.textContent = '';
}

function stageRevisionDraft(target, content) {
  if (!(target in revisionDrafts) || !content.trim()) return;
  revisionDrafts[target] = content;
  selectedRevisionSources.add(target);
  activeRevisionTarget = target;
  renderRevisionSourceList();
  showActiveRevisionSource();
  syncBatchRevisionState();
}

function getChangedRevisionDrafts() {
  return Object.fromEntries(
    Object.keys(revisionDrafts)
      .filter(target => revisionDrafts[target] !== revisionSources[target])
      .map(target => [target, revisionDrafts[target]])
  );
}

async function submitBatchRevision() {
  const btn = document.getElementById('applyBatchRevisionBtn');
  btn.disabled = true;
  hide('error-card');
  try {
    const changedSources = {};
    for (const target of selectedRevisionSources) {
      if (revisionDrafts[target] !== revisionSources[target]) {
        changedSources[target] = revisionDrafts[target];
      }
    }
    if (Object.keys(changedSources).length === 0) {
      throw new Error('请先修改并选择至少一个源文件');
    }
    setProgress(0, 1, '正在创建批量修订任务');
    await runRevisionTask({
        action: 'apply',
        base_version: getRevisionBaseVersion(),
        changed_sources: changedSources,
    });
  } catch (err) {
    showError(err.message);
  } finally {
    syncBatchRevisionState();
    hide('progress-card');
  }
}

async function runRevisionTask(payload) {
  activeAbortController = new AbortController();
  const resp = await fetch('/api/revisions/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
    signal: activeAbortController.signal,
  });
  activeTaskId = resp.headers.get('X-Task-Id');
  if (!resp.ok) {
    const error = await resp.json().catch(() => ({}));
    throw new Error(error.detail || `批量任务启动失败 ${resp.status}`);
  }
  try {
    for await (const {event, data} of readSSE(resp)) {
      if (event === 'progress') {
        setProgress(data.stage, data.total, data.name);
      } else if (event === 'result') {
        lastResult = data;
        lastFullMD = normalizeFullMD(data.full_md || '');
        renderResult(data);
        updateVersionLabel(data.saved_as || data.revision_dir || '', data.revision_status);
        show('result-card');
      } else if (event === 'error') {
        throw new Error(data.message || '批量任务失败');
      } else if (event === 'cancelled') {
        hide('progress-card');
      }
    }
  } finally {
    activeAbortController = null;
    activeTaskId = null;
  }
}

function applyChapterRevision() {
  if (!revisionPreviewData?.changed) return;
  stageRevisionDraft(
    revisionPreviewData.target,
    revisionPreviewData.revised_content,
  );
  clearRevisionPreview();
}


function downloadResult() {
  if (!lastResult) return;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  a.download = `script_modified_${ts}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function updateVersionLabel(filename, revisionStatus = '') {
  const el = document.getElementById('currentVersionLabel');
  if (!el) return;
  if (!filename) { el.style.display = 'none'; return; }
  const sourceLabel = { script_generate:'初始生成', script_revise:'源文件修订' };
  // 格式: v06/script_generate_*.json 或 v06/revisions/r01/script_revise_*.json
  const match = filename.match(/^(v\d{2})(?:\/revisions\/(r\d{2}))?\/(script_[a-z_]+?)_\d/);
  if (match) {
    el.style.display = 'inline';
    const version = match[2] ? `${match[1]}-${match[2]}` : match[1];
    const status = revisionStatus === 'review_required'
      ? ' <span style="color:var(--danger);">· 待人工处理</span>'
      : '';
    el.innerHTML = `<span style="font-weight:700;">${esc(version.toUpperCase())}</span> <span style="color:var(--text-muted);">${esc(sourceLabel[match[3]] || match[3])}</span>${status}`;
    el.title = revisionStatus === 'review_required'
      ? '存在未同步章节、程序校验问题或连续性审查建议'
      : '';
    return;
  }
  el.style.display = 'none';
}

// ===== 版本历史 =====
async function toggleVersions() {
  const card = document.getElementById('versions-card');
  if (!card.classList.contains('hidden')) {
    card.classList.add('hidden');
    return;
  }
  card.classList.remove('hidden');
  document.getElementById('versionsList').innerHTML = '<span style="color:var(--text-muted);">加载中...</span>';

  try {
    const resp = await fetch('/api/versions');
    const { versions } = await resp.json();
    if (!versions || !versions.length) {
      document.getElementById('versionsList').innerHTML = '<span style="color:var(--text-muted);">暂无历史版本</span>';
      return;
    }
    const sourceLabel = {
      'script_generate': '初始生成', 'script_revise': '源文件修订',
    };
    document.getElementById('versionsList').innerHTML = versions.map(v => {
      const pref = v.prefix || '';
      const label = sourceLabel[pref] || pref;
      const versionBadge = v.label
        ? `<span style="font-weight:700; color:var(--accent); font-size:13px; background:var(--bg); padding:2px 8px; border-radius:4px; margin-right:6px;">${esc(v.label)}</span>`
        : '';
      return `
      <div style="padding:8px 6px; border-bottom:1px dotted var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer;"
           data-filename="${encodeURIComponent(String(v.filename || '').replace(/\\/g, '/'))}"
           onclick="loadVersionFromRow(this)"
           onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;">
            ${versionBadge}
            <span style="font-size:12px;">${esc(label)}</span>
            ${v.revision_status === 'review_required' ? '<span style="font-size:11px; color:var(--danger);">待人工处理</span>' : ''}
          </div>
          <strong style="font-size:14px;">${esc(v.title)}</strong>
          <br><small style="color:var(--text-muted);">${v.timestamp?.replace('T',' ').slice(0,19)||''}${v.chapters_count ? ` | 章节×${v.chapters_count}` : ''}${v.npc_count ? ` | NPC×${v.npc_count}` : ''}${v.decision_count ? ` | 决策×${v.decision_count}` : ''}</small>
        </div>

function loadVersionFromRow(row) {
  const encoded = row?.dataset?.filename || '';
  const filename = encoded ? decodeURIComponent(encoded) : '';
  if (filename) loadVersion(filename);
}

function versionApiPath(filename) {
  return String(filename || '')
    .replace(/\\/g, '/')
    .split('/')
    .filter(Boolean)
    .map(segment => encodeURIComponent(segment))
    .join('/');
}

async function loadVersion(filename) {
  try {
    const apiPath = versionApiPath(filename);
    if (!apiPath) throw new Error('版本文件名为空');
    const resp = await fetch(`/api/version/${apiPath}`);
    if (!resp.ok) throw new Error('加载失败 ' + resp.status);
    const data = await resp.json();
    lastResult = data;
    if (data.full_md) {
      lastFullMD = normalizeFullMD(data.full_md);
                }
    renderResult(data);
    show('result-card');
    updateVersionLabel(data.filename || data.saved_as || '', data.revision_status);
    document.getElementById('versions-card').classList.add('hidden');
    document.getElementById('result-card').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    showError('加载版本失败：' + err.message);
  }
}

// ===== 生成 =====
async function startGeneration(resumeVersion = '') {
  const scenario = document.getElementById('scenario').value.trim();
  const playerRole = document.getElementById('playerRole').value.trim();
  const learningGoal = document.getElementById('learningGoal').value.trim();

  if (!scenario || !playerRole || !learningGoal) {
    showError('请填写政策场景、玩家角色和教育目标');
    return;
  }

  hide('error-card');
  hide('result-card');
  resetProgressLog();
  const btn = document.getElementById('oneClickBtn');
  setButtonLoading(btn, true);

  activeAbortController = new AbortController();

  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scenario,
        player_role: playerRole,
        learning_goal: learningGoal,
        duration_minutes: parseInt(document.getElementById('duration').value),
        complexity: document.getElementById('complexity').value,
        npc_count: parseInt(document.getElementById('npcCount').value),
        chapter_count: parseInt(document.getElementById('chapterCount').value),
        ending_count: parseInt(document.getElementById('endingCount').value),
        decision_point_count: parseInt(document.getElementById('decisionPointCount').value),
        character_settings: document.getElementById('characterSettings').value.trim(),
        story_background: document.getElementById('storyBackground').value.trim(),
        extra_requirements: document.getElementById('extra').value.trim(),
        resume_version: resumeVersion,
      }),
      signal: activeAbortController.signal,
    });

    // 从响应头拿 task_id
    activeTaskId = resp.headers.get('X-Task-Id');

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || '请求失败 ' + resp.status);
    }

    for await (const { event, data } of readSSE(resp)) {
      if (event === 'progress') {
        setProgress(data.stage, data.total, data.name);
      } else if (event === 'result') {
        lastResult = data;
        if (data.full_md) {
          lastFullMD = normalizeFullMD(data.full_md);
                            }
        renderResult(data);
        hide('progress-card');
        show('result-card');
        updateVersionLabel(data.saved_as || '');
      } else if (event === 'error') {
        showError(data.message);
      } else if (event === 'cancelled') {
        hide('progress-card');
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      // 用户主动取消，不显示错误
    } else {
      showError(err.message);
    }
  } finally {
    setButtonLoading(btn, false);
    activeAbortController = null;
    activeTaskId = null;
  }
}

// ===== 数据规范化 =====
function normalizeFullMD(raw) {
  if (!raw) return '';
  // 如果 full_md 是不小心存进去的 JSON，提取内层 full_md
  if (raw.trim().startsWith('{')) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed.full_md && typeof parsed.full_md === 'string') {
        return parsed.full_md;
      }
    } catch {}
  }
  return raw;
}

let lastFullMD = '';

  return startGeneration();
}


function renderMarkdown(md) {
  if (!md) return '';
  let html = '';
  const lines = md.split('\n');
  let inList = false;
  let inBlockquote = false;
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    
    // Empty line
    if (!line.trim()) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      continue;
    }
    
    // Headings
    if (line.match(/^### /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h3 style="margin:16px 0 8px; color:var(--accent); font-size:16px;">' + processInline(line.slice(4)) + '</h3>';
      continue;
    }
    if (line.match(/^## /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h2 style="margin:20px 0 10px; color:var(--accent); font-size:18px; border-bottom:1px solid var(--border); padding-bottom:6px;">' + processInline(line.slice(3)) + '</h2>';
      continue;
    }
    if (line.match(/^# /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h1 style="margin:24px 0 12px; color:var(--accent); font-size:20px;">' + processInline(line.slice(2)) + '</h1>';
      continue;
    }
    
    // Horizontal rule
    if (line.match(/^---+$/)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">';
      continue;
    }
    
    // Blockquote
    if (line.match(/^> /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inBlockquote) { html += '<blockquote style="margin:8px 0; padding:8px 16px; border-left:3px solid var(--accent-light); background:#fdfaf5; border-radius:0 var(--radius) var(--radius) 0;">'; inBlockquote = true; }
      html += '<p style="margin:4px 0; color:var(--text-muted);">' + processInline(line.slice(2)) + '</p>';
      continue;
    }
    
    // Unordered list
    if (line.match(/^[-*] /)) {
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      if (!inList) { html += '<ul style="margin:4px 0; padding-left:24px;">'; inList = true; }
      html += '<li style="margin:2px 0;">' + processInline(line.slice(2)) + '</li>';
      continue;
    }
    
    // Data point / special markup
    if (line.match(/^> \*\*/) || line.match(/^> \*\*/)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inBlockquote) { html += '<blockquote style="margin:8px 0; padding:8px 16px; border-left:3px solid var(--accent-light); background:#fdfaf5; border-radius:0 var(--radius) var(--radius) 0;">'; inBlockquote = true; }
      html += '<p style="margin:4px 0; color:var(--text-muted);">' + processInline(line.replace(/^> /, '')) + '</p>';
      continue;
    }
    
    // Regular paragraph
    if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
    if (inList) { html += '</ul>'; inList = false; }
    html += '<p style="margin:4px 0;">' + processInline(line) + '</p>';
  }
  
  if (inList) html += '</ul>';
  if (inBlockquote) html += '</blockquote>';
  return html;
}

function processInline(text) {
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--accent);">$1</strong>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code style="background:var(--bg); padding:1px 5px; border-radius:3px; font-size:0.9em;">$1</code>');
  // Em dash
  text = text.replace(/---/g, '—');
  return text;
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}

</script>
