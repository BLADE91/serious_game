      <div class="npc-chip" id="npc-${esc(n.npc_id)}">
        <button class="inline-edit-btn-sm" onclick="event.stopPropagation();openManualEdit(document.getElementById('npc-${esc(n.npc_id)}'),'NPC','${esc(n.npc_id)}','${esc(n.name)}')">✏️</button>
        <span class="name">${esc(n.name)}</span>
        <span class="type type-${n.npc_type}">${typeLabels[n.npc_type]||n.npc_type}</span>
        <br><small>${esc(n.group)} | 信任=${n.trust_to_player} | 态度=${n.attitude_score}</small>
      </div>
    `).join('')}</div>
    <h3 style="margin-top:16px;">关系网络（${(s.npc_relationships||[]).length} 条）</h3>
    ${Object.entries(relsByType).map(([type, rels]) => `
      <div class="rel-group">
        <h4>【${esc(type)}】</h4>
        ${rels.map((r, ri) => {
          const relIdx = (s.npc_relationships||[]).indexOf(r);
          const relId = `${esc(r.from_npc_id)}|${esc(r.to_npc_id)}|${relIdx}`;
          const relTitle = `${esc(nameMap[r.from_npc_id]||r.from_npc_id)}→${esc(nameMap[r.to_npc_id]||r.to_npc_id)}`;
          return `
          <div class="rel-item" id="rel-${relIdx}">
            <button class="inline-edit-btn-sm" onclick="event.stopPropagation();openManualEdit(document.getElementById('rel-${relIdx}'),'关系','${relId}','${relTitle}')">✏️</button>
            <span>${esc(nameMap[r.from_npc_id]||r.from_npc_id)} <span class="arrow">→</span> ${esc(nameMap[r.to_npc_id]||r.to_npc_id)}</span>
            <span class="desc">强度=${r.strength}：${esc(r.description)}</span>
          </div>`;
        }).join('')}
      </div>
    `).join('')}
  `;

  // 分叉树面板
  renderTree(s);

  // 剧本原文面板（Markdown 渲染 + 可切换编辑）
  const md = normalizeFullMD(data.full_md) || lastFullMD || '';
  if (md) {
    document.getElementById('panel-mdtext').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:12px; color:var(--text-muted);">${md.length} 字符</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary btn-sm" id="mdEditToggle" onclick="toggleMdEdit()">✏️ 编辑</button>
        </div>
      </div>
      <div id="mdRendered" style="font-size:14px; line-height:1.9; padding:16px; background:var(--bg); border-radius:var(--radius); max-height:600px; overflow-y:auto;">${renderMarkdown(md)}</div>
      <textarea id="mdEditor" style="display:none; width:100%; min-height:400px; font-size:13px; line-height:1.8; padding:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); resize:vertical;">${esc(md)}</textarea>
    `;
    lastFullMD = md;
  } else {
    document.getElementById('panel-mdtext').innerHTML = '<p style="color:var(--text-muted); padding:20px; text-align:center;">暂无剧本原文</p>';
  }

  // Show MD area with content
  if (md) {
        lastFullMD = md;
  }
}

// ===== 数据规范化 =====
function normalizeFullMD(raw) {
  if (!raw) return '';
  // 如果 full_md 是不小心存进去的 JSON，提取内层 full_md
  if (raw.trim().startsWith('{')) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed.full_md && typeof parsed.full_md === 'string') {
        return parsed.full_md;
      }
    } catch {}
  }
  return raw;
}

// ===== 分叉树渲染 =====
let treeState = { offsetX: 0, offsetY: 0, scale: 1, dragging: false, startX: 0, startY: 0, collapsed: {} };
let lastFullMD = '';

function buildTreeData(script) {
  const decisions = (script.decision_points || []).slice().sort((a, b) => {
    const da = parseInt((a.day_window || '1').replace(/[^0-9]/g, '')) || 1;
    const db = parseInt((b.day_window || '1').replace(/[^0-9]/g, '')) || 1;
    return da - db;
  });
  const endings = script.endings || [];
  // Group by act, then split into visual rows (max 4 per row)
  const actGroups = [[], [], []];
  decisions.forEach(d => {
    const day = parseInt((d.day_window || '1').replace(/[^0-9]/g, '')) || 1;
    if (day <= 20) actGroups[0].push(d);
    else if (day <= 55) actGroups[1].push(d);
    else actGroups[2].push(d);
  });
  // Flatten acts into visual rows
  const MAX_PER_ROW = 4;
  const visualRows = [];  // [{nodes, actLabel}]
  for (let a = 0; a < 3; a++) {
    const nodes = actGroups[a];
    if (!nodes.length) continue;
    const actNames = ['第一幕：开局破冰', '第二幕：矛盾激化', '第三幕：收束结局'];
    for (let i = 0; i < nodes.length; i += MAX_PER_ROW) {
      visualRows.push({
        nodes: nodes.slice(i, i + MAX_PER_ROW),
        actLabel: i === 0 ? actNames[a] : '',
      });
    }
  }
  return { decisions, endings, visualRows };
}

function renderTree(script) {
	  const panel = document.getElementById('panel-tree');
	  if (!panel) return;
	  if (!script || !script.decision_points || !script.decision_points.length) {
	    panel.innerHTML = '<p style="color:var(--text-muted); padding:40px; text-align:center;">暂无决策点数据，无法生成分叉树</p>';
	    return;
	  }
	  const { decisions, endings, visualRows } = buildTreeData(script);
	  const MAX_PER_COL = 4;
	  const NODE_W = 170, NODE_H = 50, COL_W = 200, SLOT_H = 90, PAD_X = 60, PAD_Y = 30;

	  // Build columns: each visualRows entry becomes a column (left→right)
	  const columns = visualRows;  // [{nodes, actLabel}]
	  const numCols = columns.length;
	  const endingsCol = numCols;  // endings column index

	  const totalW = PAD_X + COL_W * (numCols + 1) + PAD_X;
	  const totalH = PAD_Y + MAX_PER_COL * SLOT_H + PAD_Y;

	  treeState = { offsetX: 0, offsetY: 0, scale: 1, dragging: false, startX: 0, startY: 0, collapsed: {} };

	  let svg = '<svg viewBox="0 0 ' + totalW + ' ' + totalH + '" style="width:100%; height:100%;">';

	  // Act background bands (vertical)
	  const actColors = ['#e8f0fe22', '#fef7e022', '#fce8e622'];
	  let lastActLabel = '';
	  for (let c = 0; c < numCols; c++) {
	    const col = columns[c];
	    if (col.actLabel && col.actLabel !== lastActLabel) {
	      const x = PAD_X + COL_W * c;
	      const w = COL_W;  // minimum width, will be extended
	      svg += '<rect x="' + x + '" y="' + PAD_Y + '" width="' + w + '" height="' + (totalH - PAD_Y * 2) + '" rx="8" fill="' + actColors[c % 3] + '" stroke="var(--border)" stroke-dasharray="6 3" opacity="0.5"/>';
	      svg += '<text x="' + (x + 8) + '" y="' + (PAD_Y + 14) + '" class="tree-label-sm" font-weight="600" fill="var(--text-muted)">' + col.actLabel + '</text>';
	      lastActLabel = col.actLabel;
	    }
	  }

	  // Helper: get node Y position within a column
	  function nodeY(nodes, i) {
	    const totalH_inner = nodes.length * SLOT_H;
	    const startY = PAD_Y + (MAX_PER_COL * SLOT_H - totalH_inner) / 2;
	    return startY + SLOT_H * i + SLOT_H / 2;
	  }

	  // Helper: get column center X
	  function colX(colIndex) {
	    return PAD_X + COL_W * colIndex + COL_W / 2;
	  }

	  // Root node (far left)
	  const rootCX = PAD_X - 10, rootCY = totalH / 2;
	  svg += '<rect x="' + (rootCX - 20) + '" y="' + (rootCY - 18) + '" width="70" height="36" rx="18" fill="var(--accent)" opacity="0.9"/>';
	  svg += '<text x="' + rootCX + '" y="' + (rootCY + 5) + '" text-anchor="middle" class="tree-label" fill="#fff" font-weight="600" font-size="11">开始</text>';

	  // Links root → first column
	  if (numCols > 0) {
	    const firstCol = columns[0].nodes;
	    firstCol.forEach((d, i) => {
	      const tx = colX(0) - NODE_W / 2;
	      const ty = nodeY(firstCol, i);
	      svg += '<line x1="' + (rootCX + 35) + '" y1="' + rootCY + '" x2="' + tx + '" y2="' + ty + '" class="tree-link" opacity="0.3"/>';
	    });
	  }

	  // Build flat sequential list
	  const flatNodes = [];
	  columns.forEach((col, c) => {
	    col.nodes.forEach((d, i) => {
	      flatNodes.push({ node: d, col: c, idx: i });
	    });
	  });

	  // Sequential chain links: DP1→DP2→DP3→...→DPn
	  for (let i = 0; i < flatNodes.length - 1; i++) {
	    const from = flatNodes[i];
	    const to = flatNodes[i + 1];
	    const fromNodes = columns[from.col].nodes;
	    const toNodes = columns[to.col].nodes;
	    const x1 = colX(from.col) + NODE_W / 2;
	    const y1 = nodeY(fromNodes, from.idx);
	    const x2 = colX(to.col) - NODE_W / 2;
	    const y2 = nodeY(toNodes, to.idx);
	    const sameCol = from.col === to.col;
	    svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" class="tree-link" opacity="' + (sameCol ? '0.3' : '0.5') + '" stroke-width="' + (sameCol ? '1' : '1.5') + '"/>';
	    if (!sameCol) {
	      svg += '<text x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 + 4) + '" text-anchor="middle" class="tree-label-sm" fill="var(--text-muted)" font-size="9">▶</text>';
	    }
	  }

	  // Links last decision → each ending
	  if (flatNodes.length > 0 && endings.length > 0) {
	    const lastNode = flatNodes[flatNodes.length - 1];
	    const lastNodes = columns[lastNode.col].nodes;
	    const lx = colX(lastNode.col) + NODE_W / 2;
	    const ly = nodeY(lastNodes, lastNode.idx);
	    endings.forEach((e, ei) => {
	      const ex = colX(endingsCol) - NODE_W / 2;
	      const ey = nodeY(endings, ei);
	      const ec = e.ending_type === 'good' ? '#27ae60' : e.ending_type === 'bad' ? '#c0392b' : '#d68910';
	      svg += '<line x1="' + lx + '" y1="' + ly + '" x2="' + ex + '" y2="' + ey + '" class="tree-link" stroke="' + ec + '" opacity="0.5" stroke-width="2"/>';
	      const label = e.ending_type === 'good' ? '✓真结局' : e.ending_type === 'bad' ? '✗坏结局' : '≈中性';
	      svg += '<text x="' + ((lx + ex) / 2) + '" y="' + ((ly + ey) / 2 - 4) + '" text-anchor="middle" class="tree-label-sm" fill="' + ec + '" font-size="9">' + label + '</text>';
	    });
	  }

	  // Draw decision nodes
	  columns.forEach((col, c) => {
	    col.nodes.forEach((d, i) => {
	      const cx = colX(c);
	      const cy = nodeY(col.nodes, i);
	      const x = cx - NODE_W / 2;
	      const y = cy - NODE_H / 2;
	      const bgColor = d.is_critical ? '#fde8e8' : '#fff';
	      svg += '<g class="tree-node' + (d.is_critical ? ' critical' : '') + '" data-id="' + d.decision_id + '" data-type="decision" onclick="treeToggleCollapse(\'' + d.decision_id + '\')">';
	      svg += '<rect x="' + x + '" y="' + y + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="6" fill="' + bgColor + '" stroke="' + (d.is_critical ? 'var(--danger)' : 'var(--accent-light)') + '" stroke-width="' + (d.is_critical ? 2.5 : 1.5) + '" class="tree-node-bg"/>';
	      const title = d.title.length > 12 ? d.title.slice(0, 12) + '…' : d.title;
	      svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" class="tree-label" font-weight="600">' + esc(d.decision_id) + ' ' + esc(title) + '</text>';
	      svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" class="tree-label-sm">' + esc(d.day_window) + ' | ' + (d.options || []).length + ' 选项</text>';
	      svg += '</g>';
	    });
	  });

	  // Ending nodes
	  if (endings.length) {
	    endings.forEach((e, i) => {
	      const cx = colX(endingsCol);
	      const cy = nodeY(endings, i);
	      const x = cx - NODE_W / 2;
	      const y = cy - NODE_H / 2;
	      const ec = e.ending_type === 'good' ? '#27ae60' : e.ending_type === 'bad' ? '#c0392b' : '#d68910';
	      const statusLabel = e.ending_type === 'good' ? '好结局' : e.ending_type === 'bad' ? '坏结局' : '中性';
	      svg += '<g class="tree-ending ' + e.ending_type + '" data-id="' + e.ending_id + '" data-type="ending">';
	      svg += '<rect x="' + x + '" y="' + y + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="20" fill="' + ec + '22" stroke="' + ec + '" stroke-width="2" class="tree-node-bg"/>';
	      svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" class="tree-label" font-weight="600">' + esc(e.title) + '</text>';
	      svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" class="tree-label-sm">' + statusLabel + ' | ' + (e.conditions || []).length + ' 条件</text>';
	      svg += '</g>';
	    });
	  }

	  svg += '</svg>';

	  const legend = '<div class="tree-legend">'
	    + '<span><span class="dot" style="background:var(--danger);"></span> 关键决策</span>'
	    + '<span><span class="dot" style="background:var(--accent-light);"></span> 普通决策</span>'
	    + '<span><span class="dot" style="background:var(--success);"></span> 好结局</span>'
	    + '<span><span class="dot" style="background:#d68910;"></span> 中性结局</span>'
	    + '<span><span class="dot" style="background:var(--danger);"></span> 坏结局</span>'
	    + '<span style="margin-left:8px;">🖱 拖拽平移 | 滚轮缩放 | 点击折叠</span>'
	    + '</div>';

	  panel.innerHTML = '<div class="tree-container" id="treeContainer">' + svg + '</div>' + legend;

	  // Tooltip
	  const oldTooltip = document.getElementById('treeTooltip');
	  if (oldTooltip) oldTooltip.remove();
	  const tooltip = document.createElement('div');
	  tooltip.className = 'tree-tooltip';
	  tooltip.id = 'treeTooltip';
	  panel.appendChild(tooltip);

	  const container = document.getElementById('treeContainer');
	  if (!container) return;
  container.addEventListener('mousedown', function(e) {
    treeState.dragging = true;
    treeState.startX = e.clientX - treeState.offsetX;
    treeState.startY = e.clientY - treeState.offsetY;
  });

  container.addEventListener('mouseover', function(e) {
    const g = e.target.closest('g[data-id]');
    if (!g) { tooltip.style.display = 'none'; return; }
    const id = g.dataset.id, type = g.dataset.type;
    let html = '';
    if (type === 'decision') {
      const dp = decisions.find(function(d) { return d.decision_id === id; });
      if (dp) {
        html = '<strong>' + esc(dp.decision_id) + ' ' + esc(dp.title) + '</strong><br>';
        html += '<small>' + esc(dp.day_window) + (dp.is_critical ? ' ★ 关键决策' : '') + '</small><br>';
        html += '<p style="margin:4px 0;">' + esc(dp.situation) + '</p>';
        html += (dp.options || []).map(function(o) { return '· ' + esc(o.label) + ': ' + esc(o.description).slice(0, 40) + '…'; }).join('<br>');
      }
    } else if (type === 'ending') {
      const ending = endings.find(function(e) { return e.ending_id === id; });
      if (ending) {
        const sl = ending.ending_type === 'good' ? '好结局' : ending.ending_type === 'bad' ? '坏结局' : '中性';
        html = '<strong>' + esc(ending.title) + '</strong> <span style="color:var(--text-muted);">' + sl + '</span><br>';
        html += '<p style="margin:4px 0;">' + esc(ending.description) + '</p>';
        html += (ending.conditions || []).map(function(c) { return '📋 ' + esc(c); }).join('<br>');
      }
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.offsetX + 15) + 'px';
    tooltip.style.top = (e.offsetY - 10) + 'px';
  });

  container.addEventListener('mouseout', function(e) {
    if (!e.target.closest('g[data-id]')) tooltip.style.display = 'none';
  });

  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    treeState.scale = Math.max(0.3, Math.min(3, treeState.scale - e.deltaY * 0.001));
    const svgEl = container.querySelector('svg');
    if (svgEl) svgEl.style.transform = 'translate(' + treeState.offsetX + 'px, ' + treeState.offsetY + 'px) scale(' + treeState.scale + ')';
  });
}

function treeToggleCollapse(decisionId) {
  treeState.collapsed[decisionId] = !treeState.collapsed[decisionId];
  if (lastResult && lastResult.script) renderTree(lastResult.script);
}

async function startOneClickGeneration() {
  return startGeneration();
}


function renderMarkdown(md) {
  if (!md) return '';
  let html = '';
  const lines = md.split('\n');
  let inList = false;
  let inBlockquote = false;
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    
    // Empty line
    if (!line.trim()) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      continue;
    }
    
    // Headings
    if (line.match(/^### /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h3 style="margin:16px 0 8px; color:var(--accent); font-size:16px;">' + processInline(line.slice(4)) + '</h3>';
      continue;
    }
    if (line.match(/^## /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h2 style="margin:20px 0 10px; color:var(--accent); font-size:18px; border-bottom:1px solid var(--border); padding-bottom:6px;">' + processInline(line.slice(3)) + '</h2>';
      continue;
    }
    if (line.match(/^# /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<h1 style="margin:24px 0 12px; color:var(--accent); font-size:20px;">' + processInline(line.slice(2)) + '</h1>';
      continue;
    }
    
    // Horizontal rule
    if (line.match(/^---+$/)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      html += '<hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">';
      continue;
    }
    
    // Blockquote
    if (line.match(/^> /)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inBlockquote) { html += '<blockquote style="margin:8px 0; padding:8px 16px; border-left:3px solid var(--accent-light); background:#fdfaf5; border-radius:0 var(--radius) var(--radius) 0;">'; inBlockquote = true; }
      html += '<p style="margin:4px 0; color:var(--text-muted);">' + processInline(line.slice(2)) + '</p>';
      continue;
    }
    
    // Unordered list
    if (line.match(/^[-*] /)) {
      if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      if (!inList) { html += '<ul style="margin:4px 0; padding-left:24px;">'; inList = true; }
      html += '<li style="margin:2px 0;">' + processInline(line.slice(2)) + '</li>';
      continue;
    }
    
    // Data point / special markup
    if (line.match(/^> \*\*/) || line.match(/^> \*\*/)) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inBlockquote) { html += '<blockquote style="margin:8px 0; padding:8px 16px; border-left:3px solid var(--accent-light); background:#fdfaf5; border-radius:0 var(--radius) var(--radius) 0;">'; inBlockquote = true; }
      html += '<p style="margin:4px 0; color:var(--text-muted);">' + processInline(line.replace(/^> /, '')) + '</p>';
      continue;
    }
    
    // Regular paragraph
    if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
    if (inList) { html += '</ul>'; inList = false; }
    html += '<p style="margin:4px 0;">' + processInline(line) + '</p>';
  }
  
  if (inList) html += '</ul>';
  if (inBlockquote) html += '</blockquote>';
  return html;
}

function processInline(text) {
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--accent);">$1</strong>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code style="background:var(--bg); padding:1px 5px; border-radius:3px; font-size:0.9em;">$1</code>');
  // Em dash
  text = text.replace(/---/g, '—');
  return text;
}

function toggleMdEdit() {
  const rendered = document.getElementById('mdRendered');
  const editor = document.getElementById('mdEditor');
  const btn = document.getElementById('mdEditToggle');
  if (!rendered || !editor) return;
  if (editor.style.display === 'none') {
    // Switch to edit mode
    rendered.style.display = 'none';
    editor.style.display = 'block';
    btn.textContent = '👁 预览';
    editor.value = lastFullMD || '';
  } else {
    // Switch to preview mode
    lastFullMD = editor.value;
    rendered.innerHTML = renderMarkdown(lastFullMD);
    rendered.style.display = 'block';
    editor.style.display = 'none';
    btn.textContent = '✏️ 编辑';
  }
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}
