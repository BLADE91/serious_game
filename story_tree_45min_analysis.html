* {

html &gt; body {
  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--viz-font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

.form-control::placeholder {

  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

  .form-check-input[type=&quot;checkbox&quot;]:checked::before {

  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;

.form-check-input[type=&quot;radio&quot;] {

  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(

  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

  const complexity = {
    &#x27;溃败&#x27;:0, &#x27;差一两户&#x27;:0.5, &#x27;压线&#x27;:1.0, &#x27;宽裕&#x27;:1.5, &#x27;全额&#x27;:2.0,
    &#x27;无知&#x27;:0, &#x27;知而捂&#x27;:0.5, &#x27;揭而未治&#x27;:1.2, &#x27;揭而已治&#x27;:2.0,
    &#x27;未触碰&#x27;:0, &#x27;捂住&#x27;:0.4, &#x27;弃车保帅&#x27;:0.8, &#x27;端掉&#x27;:1.2,
    &#x27;归心&#x27;:1.5, &#x27;认可&#x27;:1.0, &#x27;疏离&#x27;:0.5, &#x27;离散&#x27;:0,
    &#x27;归附&#x27;:1.2, &#x27;中立&#x27;:0.5, &#x27;对立&#x27;:0.4, &#x27;掘坟结怨&#x27;:0.8,
    &#x27;未起疑&#x27;:0, &#x27;警觉&#x27;:0.5, &#x27;立案&#x27;:1.0,
    &#x27;拥护&#x27;:1.0, &#x27;离心&#x27;:0.4, &#x27;结怨&#x27;:0.7,
    &#x27;未接触&#x27;:0, &#x27;结盟发稿&#x27;:1.0, &#x27;被压制&#x27;:0.7,
    &#x27;揽责&#x27;:0.8, &#x27;居功&#x27;:0.3,
    &#x27;背书&#x27;:1.0, &#x27;默许&#x27;:0.5, &#x27;弃保&#x27;:0.7, &#x27;否决&#x27;:0.9
  };

  const svg = root.querySelector(&#x27;#sg-tree-svg&#x27;);
  const scene = root.querySelector(&#x27;#sg-scene&#x27;);
  const edgesLayer = root.querySelector(&#x27;#sg-edges&#x27;);
  const nodesLayer = root.querySelector(&#x27;#sg-nodes&#x27;);
  const turnsEl = root.querySelector(&#x27;#sg-turns&#x27;);
  const secondsEl = root.querySelector(&#x27;#sg-seconds&#x27;);
  const turnsValueEl = root.querySelector(&#x27;#sg-turns-value&#x27;);
  const secondsValueEl = root.querySelector(&#x27;#sg-seconds-value&#x27;);
  const detailCodeEl = root.querySelector(&#x27;#sg-detail-code&#x27;);
  const detailTitleEl = root.querySelector(&#x27;#sg-detail-title&#x27;);
  const detailTextEl = root.querySelector(&#x27;#sg-detail-text&#x27;);
  const searchEl = root.querySelector(&#x27;#sg-search&#x27;);
  const kindLabel = { main: &#x27;必经剧情&#x27;, conditional: &#x27;条件剧情&#x27;, event: &#x27;突发事件&#x27; };
  const structuralMin = chapters.reduce((sum, chapter) =&gt; sum + chapter.minutes[0], 0);
  const structuralMax = chapters.reduce((sum, chapter) =&gt; sum + chapter.minutes[1], 0);
  const expandedChapters = new Set();
  const expandedGroups = new Set();
  const expandedEndings = new Set();
  const endingGroups = [
    { id: &#x27;G1&#x27;, label: &#x27;结局 01-06&#x27;, detail: &#x27;入局败露、否决、暴力与全线失败&#x27;, endings: endings.slice(0, 6) },
    { id: &#x27;G2&#x27;, label: &#x27;结局 07-12&#x27;, detail: &#x27;失守、粉饰、串供与知情捂盖&#x27;, endings: endings.slice(6, 12) },
    { id: &#x27;G3&#x27;, label: &#x27;结局 13-18&#x27;, detail: &#x27;弃车保帅、民心离散与舆论代价&#x27;, endings: endings.slice(12, 18) },
    { id: &#x27;G4&#x27;, label: &#x27;结局 19-24&#x27;, detail: &#x27;巡察、清白收官与兜底结局&#x27;, endings: endings.slice(18, 24) }
  ];
  const nodeById = new Map();
  const positionById = new Map();
  let selectedId = &#x27;root&#x27;;
  let layoutBounds = { minX: 0, minY: 0, maxX: 1000, maxY: 1000 };
  let transform = { x: 0, y: 0, k: 1 };
  const NODE_W = 184;
  const NODE_H = 58;
  const LEAF_H = 72;
  const X_STEP = 218;
  const Y_STEP = 102;

  function treeNode(id, code, label, type, detail, children = []) {
    return { id, code, label, type, detail, children };
  }

  function buildTree() {
    const rootNode = treeNode(&#x27;root&#x27;, &#x27;根节点&#x27;, &#x27;李致远到任云溪县&#x27;, &#x27;root&#x27;, &#x27;全部剧情路径的共同起点。&#x27;);
    let cursor = rootNode;
    chapters.forEach(chapter =&gt; {
      const chapterNode = treeNode(
        chapter.id,
        chapter.id,
        `${chapter.name} · ${chapter.days}`,
        &#x27;chapter&#x27;,
        `${chapter.nodes.length} 个具体剧情节点，基础时长 ${chapter.minutes[0]}-${chapter.minutes[1]} 分钟。点击可展开或收起。`
      );
      cursor.children = [chapterNode];
      cursor = chapterNode;
      if (expandedChapters.has(chapter.id)) {
        chapter.nodes.forEach(node =&gt; {
          const plotNode = treeNode(node[0], node[0], node[1], node[2], `${chapter.id} ${chapter.name} · ${kindLabel[node[2]]}`);
          cursor.children = [plotNode];
          cursor = plotNode;
        });
      }
    });
    const settlement = treeNode(&#x27;settlement&#x27;, &#x27;第 90 日&#x27;, &#x27;十四条轴按优先级结算&#x27;, &#x27;settlement&#x27;, &#x27;根据资源、民心、程序、廉政、舆情等状态，进入第一个命中的主结局。&#x27;);
    cursor.children = [settlement];
    settlement.children = endingGroups.map(group =&gt; {
      const groupNode = treeNode(group.id, group.label, group.detail, &#x27;ending&#x27;, &#x27;结局分组节点。点击展开其中六个具体主结局。&#x27;);
      if (expandedGroups.has(group.id)) {
        groupNode.children = group.endings.map(ending =&gt; {
          const endingNode = treeNode(`END-${ending[0]}`, `#${ending[0]}`, ending[1], &#x27;ending&#x27;, `触发条件：${ending[2]}`);
          endingNode.ending = ending;
          if (expandedEndings.has(ending[0])) {
            endingNode.children = ending[3].map((leafName, index) =&gt; {
              const letter = String.fromCharCode(97 + index);
              const leaf = treeNode(`LEAF-${ending[0]}${letter}`, `${ending[0]}${letter}`, leafName, &#x27;leaf&#x27;, `${ending[1]}的叶子结局`);
              leaf.ending = ending;
              leaf.leafName = leafName;
              return leaf;
            });
          }
          return endingNode;
        });
      }
      return groupNode;
    });
    return rootNode;
  }

  function estimate(ending, leafName) {
    const dialogueMinutes = chapters.length * Number(turnsEl.value) * Number(secondsEl.value) / 60;
    const mainMod = Number(ending[4]);
    const leafMod = complexity[leafName] ?? 0.5;
    return [
      structuralMin + 2 + dialogueMinutes + mainMod + leafMod,
      structuralMax + 3 + dialogueMinutes * 1.35 + mainMod + leafMod * 1.25
    ];
  }

  function layoutTree(tree) {
    nodeById.clear();
    positionById.clear();
    let leafIndex = 0;
    let maxDepth = 0;
    function visit(node, depth) {
      nodeById.set(node.id, node);
      maxDepth = Math.max(maxDepth, depth);
      const childXs = node.children.map(child =&gt; visit(child, depth + 1));
      const x = childXs.length ? childXs.reduce((sum, value) =&gt; sum + value, 0) / childXs.length : 80 + leafIndex++ * X_STEP;
      const y = 54 + depth * Y_STEP;
      positionById.set(node.id, { x, y });
      return x;
    }
    visit(tree, 0);
    const xs = [...positionById.values()].map(position =&gt; position.x);
    layoutBounds = {
      minX: Math.min(...xs) - NODE_W / 2 - 30,
      maxX: Math.max(...xs) + NODE_W / 2 + 30,
      minY: 10,
      maxY: 54 + maxDepth * Y_STEP + LEAF_H + 30
    };
  }

  function svgElement(name, attributes = {}) {
    const element = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, name);
    Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, value));
    return element;
  }

  function splitLabel(label, max = 13) {
    if (label.length &lt;= max) return [label];
    return [label.slice(0, max), `${label.slice(max, max * 2 - 1)}${label.length &gt; max * 2 - 1 ? &#x27;…&#x27; : &#x27;&#x27;}`];
  }

  function isExpandable(node) {
    return node.type === &#x27;chapter&#x27; || node.id.startsWith(&#x27;G&#x27;) || node.id.startsWith(&#x27;END-&#x27;);
  }

  function isExpanded(node) {
    if (node.type === &#x27;chapter&#x27;) return expandedChapters.has(node.id);
    if (node.id.startsWith(&#x27;G&#x27;)) return expandedGroups.has(node.id);
    if (node.id.startsWith(&#x27;END-&#x27;)) return expandedEndings.has(node.ending[0]);
    return false;
  }

  function drawEdge(parent, child) {
    const start = positionById.get(parent.id);
    const end = positionById.get(child.id);
    const midY = (start.y + end.y) / 2;
    edgesLayer.appendChild(svgElement(&#x27;path&#x27;, {
      d: `M ${start.x} ${start.y + NODE_H / 2} C ${start.x} ${midY}, ${end.x} ${midY}, ${end.x} ${end.y - NODE_H / 2}`,
      class: `sg-edge ${child.type === &#x27;chapter&#x27; || [&#x27;main&#x27;,&#x27;conditional&#x27;,&#x27;event&#x27;,&#x27;settlement&#x27;].includes(child.type) ? &#x27;sg-edge-trunk&#x27; : &#x27;&#x27;}`
    }));
    child.children.forEach(grandchild =&gt; drawEdge(child, grandchild));
  }

  function showDetail(node) {
    selectedId = node.id;
    detailCodeEl.textContent = node.code;
    detailTitleEl.textContent = node.label;
    if (node.type === &#x27;leaf&#x27;) {
      const [low, high] = estimate(node.ending, node.leafName);
      detailTextEl.textContent = `${node.ending[1]} / ${node.leafName}；根到叶预计 ${low.toFixed(1)}-${high.toFixed(1)} 分钟，当前规则理论上限为 ∞。`;
    } else {
      detailTextEl.textContent = node.detail;
    }
    nodesLayer.querySelectorAll(&#x27;.sg-node&#x27;).forEach(element =&gt; element.classList.toggle(&#x27;is-selected&#x27;, element.dataset.id === node.id));
  }

  function toggleNode(node) {
    if (node.type === &#x27;chapter&#x27;) {
      expandedChapters.has(node.id) ? expandedChapters.delete(node.id) : expandedChapters.add(node.id);
    } else if (node.id.startsWith(&#x27;G&#x27;)) {
      expandedGroups.has(node.id) ? expandedGroups.delete(node.id) : expandedGroups.add(node.id);
    } else if (node.id.startsWith(&#x27;END-&#x27;)) {
      const endingId = node.ending[0];
      expandedEndings.has(endingId) ? expandedEndings.delete(endingId) : expandedEndings.add(endingId);
    } else {
      showDetail(node);
      return;
    }
    renderTree();
    const updated = nodeById.get(node.id);
    if (updated) showDetail(updated);
    focusNode(node.id, .9);
  }

  function drawNode(node) {
    const position = positionById.get(node.id);
    const height = node.type === &#x27;leaf&#x27; ? LEAF_H : NODE_H;
    const group = svgElement(&#x27;g&#x27;, {
      class: `sg-node sg-node-${node.type}${selectedId === node.id ? &#x27; is-selected&#x27; : &#x27;&#x27;}`,
      transform: `translate(${position.x - NODE_W / 2} ${position.y - height / 2})`,
      tabindex: &#x27;0&#x27;,
      role: &#x27;button&#x27;,
      &#x27;aria-label&#x27;: `${node.code} ${node.label}`,
      &#x27;data-id&#x27;: node.id
    });
    group.appendChild(svgElement(&#x27;rect&#x27;, { width: NODE_W, height }));
    const title = svgElement(&#x27;title&#x27;);
    title.textContent = `${node.code} · ${node.label}`;
    group.appendChild(title);
    const code = svgElement(&#x27;text&#x27;, { x: 10, y: 17, class: &#x27;sg-node-code&#x27; });
    code.textContent = node.code;
    group.appendChild(code);
    const label = svgElement(&#x27;text&#x27;, { x: 10, y: 36 });
    splitLabel(node.label).forEach((line, index) =&gt; {
      const part = svgElement(&#x27;tspan&#x27;, { x: 10, dy: index === 0 ? 0 : 16 });
      part.textContent = line;
      label.appendChild(part);
    });
    group.appendChild(label);
    if (node.type === &#x27;leaf&#x27;) {
      const [low, high] = estimate(node.ending, node.leafName);
      const time = svgElement(&#x27;text&#x27;, { x: 10, y: 64, class: &#x27;sg-node-code&#x27; });
      time.textContent = `${low.toFixed(1)}-${high.toFixed(1)} 分钟 · 上限 ∞`;
      group.appendChild(time);
    }
    if (isExpandable(node)) {
      const toggle = svgElement(&#x27;text&#x27;, { x: NODE_W - 18, y: 19, class: &#x27;sg-node-toggle&#x27;, &#x27;text-anchor&#x27;: &#x27;middle&#x27; });
      toggle.textContent = isExpanded(node) ? &#x27;−&#x27; : &#x27;+&#x27;;
      group.appendChild(toggle);
    }
    group.addEventListener(&#x27;click&#x27;, event =&gt; { event.stopPropagation(); toggleNode(node); });
    group.addEventListener(&#x27;keydown&#x27;, event =&gt; {
      if (event.key === &#x27;Enter&#x27; || event.key === &#x27; &#x27;) {
        event.preventDefault();
        toggleNode(node);
      }
    });
    nodesLayer.appendChild(group);
    node.children.forEach(drawNode);
  }

  function renderTree(fit = false) {
    const tree = buildTree();
    layoutTree(tree);
    edgesLayer.replaceChildren();
    nodesLayer.replaceChildren();
    tree.children.forEach(child =&gt; drawEdge(tree, child));
    drawNode(tree);
    if (fit) requestAnimationFrame(fitTree);
    else applyTransform();
  }

  function applyTransform() {
    scene.setAttribute(&#x27;transform&#x27;, `translate(${transform.x} ${transform.y}) scale(${transform.k})`);
  }

  function fitTree() {
    const rect = svg.getBoundingClientRect();
    const width = layoutBounds.maxX - layoutBounds.minX;
    const height = layoutBounds.maxY - layoutBounds.minY;
    const scale = Math.max(.12, Math.min(1.1, (rect.width - 50) / width, (rect.height - 50) / height));
    transform.k = scale;
    transform.x = (rect.width - width * scale) / 2 - layoutBounds.minX * scale;
    transform.y = (rect.height - height * scale) / 2 - layoutBounds.minY * scale;
    applyTransform();
  }

  function focusNode(id, desiredScale = 1) {
    const position = positionById.get(id);
    if (!position) return;
    const rect = svg.getBoundingClientRect();
    transform.k = Math.max(.55, Math.min(1.5, desiredScale));
    transform.x = rect.width / 2 - position.x * transform.k;
    transform.y = rect.height / 2 - position.y * transform.k;
    applyTransform();
  }

  function adjustZoom(multiplier) {
    const rect = svg.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const oldScale = transform.k;
    const newScale = Math.max(.12, Math.min(2.5, oldScale * multiplier));
    transform.x = centerX - (centerX - transform.x) * newScale / oldScale;
    transform.y = centerY - (centerY - transform.y) * newScale / oldScale;
    transform.k = newScale;
    applyTransform();
  }

  function findAndFocus() {
    const query = searchEl.value.trim().toLowerCase();
    if (!query) return;
    const chapterMatch = chapters.find(chapter =&gt; chapter.id.toLowerCase() === query || chapter.name.toLowerCase().includes(query));
    if (chapterMatch) {
      expandedChapters.add(chapterMatch.id);
      renderTree();
      showDetail(nodeById.get(chapterMatch.id));
      focusNode(chapterMatch.id);
      return;
    }
    for (const chapter of chapters) {
      const plot = chapter.nodes.find(node =&gt; node[0].toLowerCase().includes(query) || node[1].toLowerCase().includes(query));
      if (plot) {
        expandedChapters.add(chapter.id);
        renderTree();
        showDetail(nodeById.get(plot[0]));
        focusNode(plot[0]);
        return;
      }
    }
    for (const group of endingGroups) {
      const ending = group.endings.find(item =&gt; item[0] === query.replace(&#x27;#&#x27;, &#x27;&#x27;) || item[1].toLowerCase().includes(query));
      if (ending) {
        expandedGroups.add(group.id);
        renderTree();
        showDetail(nodeById.get(`END-${ending[0]}`));
        focusNode(`END-${ending[0]}`);
        return;
      }
    }
    detailCodeEl.textContent = &#x27;未找到&#x27;;
    detailTitleEl.textContent = searchEl.value.trim();
    detailTextEl.textContent = &#x27;请尝试输入完整 DP/EV 编号、章节名或主结局名称。&#x27;;
  }

  let drag = null;
  svg.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
    if (event.target.closest(&#x27;.sg-node&#x27;)) return;
    drag = { x: event.clientX, y: event.clientY, tx: transform.x, ty: transform.y };
    svg.classList.add(&#x27;is-dragging&#x27;);
    svg.setPointerCapture(event.pointerId);
  });
  svg.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
    if (!drag) return;
    transform.x = drag.tx + event.clientX - drag.x;
    transform.y = drag.ty + event.clientY - drag.y;
    applyTransform();
  });
  svg.addEventListener(&#x27;pointerup&#x27;, event =&gt; {
    drag = null;
    svg.classList.remove(&#x27;is-dragging&#x27;);
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
  });
  svg.addEventListener(&#x27;wheel&#x27;, event =&gt; {
    event.preventDefault();
    const rect = svg.getBoundingClientRect();
    const pointerX = event.clientX - rect.left;
    const pointerY = event.clientY - rect.top;
    const oldScale = transform.k;
    const newScale = Math.max(.12, Math.min(2.5, oldScale * (event.deltaY &lt; 0 ? 1.12 : .89)));
    transform.x = pointerX - (pointerX - transform.x) * newScale / oldScale;
    transform.y = pointerY - (pointerY - transform.y) * newScale / oldScale;
    transform.k = newScale;
    applyTransform();
  }, { passive: false });

  root.querySelector(&#x27;#sg-search-button&#x27;).addEventListener(&#x27;click&#x27;, findAndFocus);
  searchEl.addEventListener(&#x27;keydown&#x27;, event =&gt; { if (event.key === &#x27;Enter&#x27;) findAndFocus(); });
  root.querySelector(&#x27;#sg-expand-chapters&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    chapters.forEach(chapter =&gt; expandedChapters.add(chapter.id));
    renderTree(true);
  });
  root.querySelector(&#x27;#sg-collapse-chapters&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    expandedChapters.clear();
    renderTree(true);
  });
  root.querySelector(&#x27;#sg-expand-endings&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    endingGroups.forEach(group =&gt; expandedGroups.add(group.id));
    endings.forEach(ending =&gt; expandedEndings.add(ending[0]));
    renderTree(true);
  });
  root.querySelector(&#x27;#sg-collapse-endings&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    expandedGroups.clear();
    expandedEndings.clear();
    renderTree(true);
  });
  root.querySelector(&#x27;#sg-zoom-in&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; adjustZoom(1.2));
  root.querySelector(&#x27;#sg-zoom-out&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; adjustZoom(.82));
  root.querySelector(&#x27;#sg-fit&#x27;).addEventListener(&#x27;click&#x27;, fitTree);
  turnsEl.addEventListener(&#x27;input&#x27;, () =&gt; {
    turnsValueEl.textContent = turnsEl.value;
    renderTree();
    if (nodeById.has(selectedId)) showDetail(nodeById.get(selectedId));
  });
  secondsEl.addEventListener(&#x27;input&#x27;, () =&gt; {
    secondsValueEl.textContent = `${secondsEl.value} 秒`;
    renderTree();
    if (nodeById.has(selectedId)) showDetail(nodeById.get(selectedId));
  });
  window.addEventListener(&#x27;resize&#x27;, fitTree);
  renderTree(true);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
